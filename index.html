<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b1527"><title>벤치에서 믈브까지</title><style>
:root{font-family:system-ui,-apple-system,'Noto Sans KR',sans-serif;color:#ecf3ff;background:#081222}*{box-sizing:border-box}body{margin:0;background:linear-gradient(150deg,#081222,#102744);min-height:100vh}button,input,select{font:inherit}button{cursor:pointer;border:0;border-radius:12px;padding:12px 14px;background:#2b72d4;color:white;font-weight:700}button:disabled{opacity:.4;cursor:default}.ghost{background:#253750}.app{max-width:550px;margin:auto;min-height:100vh;padding:20px 16px 95px}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.muted{color:#a9bad2;font-size:13px}.small{font-size:12px}.brand{font-weight:900;letter-spacing:-.6px;font-size:21px}.card{background:#14263e;border:1px solid #304563;border-radius:18px;padding:17px;margin:12px 0;box-shadow:0 8px 24px #0002}.hero{background:linear-gradient(130deg,#153a6b,#13233d)}h1,h2,h3,p{margin:0 0 10px}h2{font-size:21px}h3{font-size:16px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.stat{padding:12px;background:#213550;border-radius:12px}.stat b{font-size:22px}.line{display:flex;justify-content:space-between;gap:10px;align-items:center;margin:8px 0}.pill{background:#29476a;border-radius:20px;padding:5px 10px;font-size:12px}.tabs{position:fixed;bottom:0;left:50%;transform:translateX(-50%);max-width:550px;width:100%;display:grid;grid-template-columns:repeat(5,1fr);background:#101f34;border-top:1px solid #344d70;padding:8px 4px calc(8px + env(safe-area-inset-bottom))}.tabs button{background:none;padding:10px 1px;font-size:12px;color:#a9bad2}.tabs button.active{color:#fff;background:#244e80}.full{width:100%;margin-top:8px}.log{max-height:270px;overflow:auto;background:#0b1a2d;border-radius:12px;padding:12px;font-size:13px;line-height:1.8}.log div{border-bottom:1px solid #243a55;padding:3px 0}.live-score{display:flex;justify-content:space-between;background:#0b1a2d;border-radius:12px;padding:13px;margin:12px 0}.live-count{color:#91c8ff;font-size:12px}.input{width:100%;background:#0b1a2d;border:1px solid #456184;border-radius:10px;color:#fff;padding:12px;margin:6px 0 13px}.choice{display:flex;gap:7px;flex-wrap:wrap}.choice button{font-size:12px;padding:9px;background:#273f5c}.choice button.sel{background:#2872d5}.bar{height:9px;background:#243a53;border-radius:10px;overflow:hidden}.bar>i{display:block;height:100%;background:#67b4ff}.notice{color:#b8e6c4}.warn{color:#ffda9b}.divider{border-top:1px solid #354b64;margin:12px 0}.center{text-align:center}.badge{font-size:12px;color:#cce2ff}.cards{display:grid;gap:9px}.offer{background:#203651;border-radius:12px;padding:13px}.offer b{color:#9ed5ff}.score{font-size:31px;font-weight:900}.spacer{height:8px}</style></head><body><div id="root" class="app"></div><script>
'use strict';const KEY='bench_to_mlb_v1';const BAT=['파워','정확','선구','주력','수비','멘탈'],PIT=['구속','구위','제구','멘탈','수비','체력'];
const styles=[
['타자','포수/1루수','홈런타자',[60,49,46,45,54,58]],['타자','포수/1루수','안타머신',[47,61,54,49,51,50]],['타자','포수/1루수','해결사',[50,59,51,46,53,53]],['타자','내야수','홈런타자',[59,49,46,52,54,52]],['타자','내야수','매의 눈',[46,53,62,51,52,48]],['타자','내야수','빠른발',[43,50,53,65,55,46]],['타자','지명타자','거포',[68,57,54,47,30,56]],['타자','지명타자','타점머신',[53,65,56,49,30,59]],['타자','지명타자','지명타자',[62,61,55,49,30,55]],['타자','외야수','장타자',[60,55,49,48,54,46]],['타자','외야수','빠른발',[43,50,53,65,55,46]],['타자','외야수','클러치 히터',[49,59,51,50,49,54]],
['투수','선발투수','파이어볼러',[63,56,45,46,50,52]],['투수','선발투수','철완',[50,55,49,52,45,61]],['투수','선발투수','해저드 브레이커',[48,50,55,61,48,50]],['투수','선발투수','어쌔신',[45,54,62,48,48,55]],['투수','중간계투','레이저볼러',[65,56,48,45,48,50]],['투수','중간계투','세이비어',[48,58,48,60,48,50]],['투수','중간계투','이닝 이터',[49,50,55,50,47,61]],['투수','마무리','터미네이터',[66,56,52,53,45,40]],['투수','마무리','돌부처',[51,67,53,55,45,41]],['투수','마무리','Born To K',[52,53,67,50,43,47]]];
let createType=null,createPos=null,createName='김민준';let sectionReport=null;let state=null,tab='홈',chosen=0,feed=[],game=null,shop=null,slots=[];
const $=s=>document.querySelector(s),rand=(a,b)=>Math.floor(Math.random()*(b-a+1))+a,clamp=(x,a,b)=>Math.max(a,Math.min(b,x)),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>Number(n).toLocaleString('ko-KR');const ovr=s=>(s.attrs.reduce((a,b)=>a+b,0)/6).toFixed(1);const names=s=>s.type==='타자'?BAT:PIT;
function emptyStats(){return {g:0,gs:0,w:0,l:0,sv:0,hld:0,bs:0,ab:0,pa:0,h:0,d2:0,d3:0,hr:0,bb:0,hbp:0,sf:0,rbi:0,r:0,sb:0,cs:0,so:0,outs:0,er:0,ra:0,k:0,walk:0,ha:0,hra:0,bf:0,pc:0}}
function normalizeStats(st){return Object.assign(emptyStats(),st||{})}
function ipDisplay(o){return `${Math.floor(o/3)}.${o%3}`}
function statNum(n,d,digits=3){return d? (n/d).toFixed(digits):'—'}
function avgNum(n,d){return d? (n/d).toFixed(3).replace(/^0/,''):'.000'}
function detailedStats(st,type){st=normalizeStats(st);let list=[],key=[];
 if(type==='투수'){
 const innings=st.outs/3,era=innings? (st.er*9/innings).toFixed(2):'—',whip=innings?((st.ha+st.walk)/innings).toFixed(2):'—';
 key=[['승-패',`${st.w}승 ${st.l}패`],['홀드',st.hld],['세이브',st.sv],['ERA',era],['WHIP',whip],['탈삼진',st.k]];
 list=[['등판',st.g],['선발',st.gs],['투구 이닝',ipDisplay(st.outs)],['피안타',st.ha],['피홈런',st.hra],['볼넷 허용',st.walk],['실점',st.ra],['자책점',st.er],['블론세이브',st.bs],['투구 수',st.pc],['K/9',innings?(st.k*9/innings).toFixed(2):'—'],['BB/9',innings?(st.walk*9/innings).toFixed(2):'—'],['K/BB',statNum(st.k,st.walk,2)],['WAR','미산출']];
 }else{
 let tb=st.h+st.d2+2*st.d3+3*st.hr,obpDen=st.ab+st.bb+st.hbp+st.sf;
 key=[['타율',avgNum(st.h,st.ab)],['출루율',avgNum(st.h+st.bb+st.hbp,obpDen)],['장타율',avgNum(tb,st.ab)],['OPS',obpDen||st.ab?((st.h+st.bb+st.hbp)/(obpDen||1)+tb/(st.ab||1)).toFixed(3):'.000'],['홈런',st.hr],['타점',st.rbi]];
 list=[['경기',st.g],['타석',st.pa],['타수',st.ab],['안타',st.h],['2루타',st.d2],['3루타',st.d3],['홈런',st.hr],['득점',st.r],['타점',st.rbi],['볼넷',st.bb],['사구',st.hbp],['삼진',st.so],['희생플라이',st.sf],['도루',st.sb],['도루실패',st.cs],['WAR','미산출'],['wRC+','미산출']];
 }
 return `<div class="grid">${key.map(([k,v])=>`<div class="stat"><div class="muted">${k}</div><b>${v}</b></div>`).join('')}</div><div class="divider"></div>${list.map(([k,v])=>`<div class="line"><span>${k}</span><b>${v}</b></div>`).join('')}`;
}
function load(){try{slots=JSON.parse(localStorage.getItem(KEY)||'[]');if(!Array.isArray(slots))slots=[]}catch(e){slots=[]}state=slots[0]||null;for(let sl of slots){sl.stats=normalizeStats(sl.stats);sl.career=sl.career||[]}render()}
function save(){if(!state)return;let ix=slots.findIndex(s=>s.id===state.id);if(ix<0)slots.unshift(state);else slots[ix]=state;localStorage.setItem(KEY,JSON.stringify(slots));}
function start(){if(chosen<0||!styles[chosen]||styles[chosen][0]!==createType||styles[chosen][1]!==createPos){alert('포지션과 스타일을 선택하세요.');return}let name=($('#playerName').value||'김민준').trim().slice(0,14),sty=styles[chosen];if(slots.length>=5){alert('진행 중인 커리어는 최대 5개입니다.');return}state={id:Date.now(),name,type:sty[0],pos:sty[1],style:sty[2],attrs:[...sty[3]],age:16,year:1,section:1,games:0,played:0,money:60,trust:50,xp:0,career:[],events:[`고교 1학년 ${name}, ${sty[2]} 스타일로 선수 생활 시작`],stats:emptyStats(),posts:[`학교 야구부에 신입 선수 ${name}이(가) 합류했습니다. 응원합니다!`],shopUsed:false,seasonWins:0};slots.unshift(state);save();tab='홈';render()}
function layout(content){$('#root').innerHTML=`<header class="head"><div><div class="brand">⚾ 벤치에서 믈브까지</div><div class="muted">BENCH TO MLB · 플레이 가능한 초기 버전</div></div><span class="pill">v0.6</span></header>${content}<nav class="tabs">${['홈','반응','시즌','선수','기록'].map(t=>`<button class="${tab===t?'active':''}" onclick="go('${t}')">${({홈:'⌂',반응:'☏',시즌:'▦',선수:'♙',기록:'★'})[t]}<br>${t}</button>`).join('')}</nav>`}
function go(t){tab=t;render();if(tab==='시즌'&&game)scheduleBroadcast()}
function rememberName(){let el=$('#playerName');if(el)createName=el.value.slice(0,14)}
function chooseType(t){rememberName();createType=t;createPos=null;chosen=-1;setup()}
function choosePos(p){rememberName();createPos=p;chosen=-1;setup()}
function pick(i){rememberName();chosen=i;setup()}
function backSetup(){rememberName();if(createPos){createPos=null;chosen=-1}else{createType=null;chosen=-1}setup()}
function radar(vals,labels){let cx=160,cy=153,r=108;let point=(i,v)=>{let a=-Math.PI/2+i*Math.PI/3;return `${(cx+Math.cos(a)*r*v).toFixed(1)},${(cy+Math.sin(a)*r*v).toFixed(1)}`};let poly=v=>v.map((n,i)=>point(i,n)).join(' ');let rings=[.25,.5,.75,1].map(v=>`<polygon points="${poly(Array(6).fill(v))}" fill="none" stroke="#42617f" stroke-width="1"/>`).join('');let axes=labels.map((l,i)=>{let a=-Math.PI/2+i*Math.PI/3;let x=cx+Math.cos(a)*137,y=cy+Math.sin(a)*137;return `<line x1="${cx}" y1="${cy}" x2="${cx+Math.cos(a)*r}" y2="${cy+Math.sin(a)*r}" stroke="#34526e"/><text x="${x}" y="${y}" fill="#d8e9ff" font-size="13" text-anchor="middle" dominant-baseline="middle">${l}</text>`}).join('');return `<svg viewBox="0 0 320 310" style="width:100%;max-width:360px;display:block;margin:4px auto" role="img" aria-label="능력치 레이더 그래프">${rings}${axes}<polygon points="${poly(vals.map(v=>v/150))}" fill="#48a6ff66" stroke="#7dccff" stroke-width="3"/>${vals.map((v,i)=>`<circle cx="${point(i,v/150).split(',')[0]}" cy="${point(i,v/150).split(',')[1]}" r="3" fill="#c7efff"/>`).join('')}</svg>`}
function setup(){let available=createType&&createPos?styles.map((s,i)=>({...s,index:i})).filter(s=>s[0]===createType&&s[1]===createPos):[];let selected=styles[chosen];layout(`<div class="card hero"><h2>새로운 야구 인생을 시작하세요</h2><p class="muted">선수 유형 → 포지션 → 플레이 스타일 순서로 선택하세요.</p><div class="muted">${createType||'유형 선택'} ${createPos?' › '+createPos:''} ${selected&&createPos?' › '+selected[2]:''}</div></div><div class="card"><h3>선수 이름</h3><input id="playerName" class="input" maxlength="14" value="${esc(createName)}" aria-label="선수 이름"><h3>1. 선수 유형</h3><div class="grid"><button class="${createType==='타자'?'':'ghost'}" onclick="chooseType('타자')">⚾ 타자</button><button class="${createType==='투수'?'':'ghost'}" onclick="chooseType('투수')">🔥 투수</button></div>${createType?`<div class="divider"></div><h3>2. 포지션 선택</h3><div class="choice">${[...new Set(styles.filter(s=>s[0]===createType).map(s=>s[1]))].map(p=>`<button class="${createPos===p?'sel':''}" onclick="choosePos('${p}')">${p}</button>`).join('')}</div>`:''}${createPos?`<div class="divider"></div><h3>3. 플레이 스타일</h3><p class="muted">선택한 포지션에서 가능한 스타일만 표시됩니다.</p><div class="choice">${available.map(s=>`<button class="${chosen===s.index?'sel':''}" onclick="pick(${s.index})">${s[2]}</button>`).join('')}</div>${selected&&selected[0]===createType&&selected[1]===createPos?`<div class="divider"></div><div class="line"><b>${selected[2]}</b><span class="pill">OVR 52.0</span></div>${radar(selected[3],createType==='타자'?BAT:PIT)}<div class="grid">${selected[3].map((v,i)=>`<div class="stat"><div class="muted">${(createType==='타자'?BAT:PIT)[i]}</div><b>${v}</b><div class="bar"><i style="width:${v/150*100}%"></i></div></div>`).join('')}</div><button class="full" onclick="start()">이 선수로 커리어 시작</button>`:'<p class="muted" style="margin-top:14px">스타일을 선택하면 능력치 그래프가 나타납니다.</p>'}`:''}${createType?'<button class="ghost full" onclick="backSetup()">← 이전 단계</button>':''}</div>${slots.length?`<div class="card"><h3>저장된 커리어</h3>${slots.map((s,i)=>`<button class="ghost full" onclick="resume(${i})">${esc(s.name)} · ${s.year}학년 · OVR ${ovr(s)}</button>`).join('')}</div>`:''}`)}
function resume(i){state=slots[i];tab='홈';render()}
function home(){let s=state;layout(`<div class="card hero"><div class="line"><span class="pill">고교 ${s.year}학년 · ${s.pos}</span><span class="badge">${s.style}</span></div><h2>${esc(s.name)}</h2><div class="line"><div><div class="muted">종합 능력치</div><div class="score">${ovr(s)}</div></div><div class="center"><div class="muted">감독 신뢰도</div><h2>${s.trust}/100</h2></div></div><div class="bar"><i style="width:${s.trust}%"></i></div></div><div class="grid"><div class="card"><div class="muted">시즌 경기</div><h2>${s.games} / 24</h2></div><div class="card"><div class="muted">보유 자금</div><h2>${fmt(s.money)}만원</h2></div></div><div class="card"><h3>다음 경기</h3><p class="muted">고교 지역 리그 · ${s.games+1}번째 경기</p><button class="full" onclick="fastSection()" ${s.finished||game?'disabled':''}>⏩ 남은 경기 빠른 진행 (${24-s.games}경기)</button><button class="ghost full" onclick="play()" ${s.finished||game?'disabled':''}>⚾ 1경기씩 진행</button><button class="ghost full" onclick="go('시즌')">시즌 및 성장 상점</button></div><div class="card"><h3>최근 소식</h3><p>${esc(s.posts[0]||'아직 소식이 없습니다.')}</p></div>`)}
function makeGame(){let s=state,participate=Math.random()<clamp(.25+(Number(ovr(s))-52)*.012+(s.trust-50)*.003,.12,.91);let count=participate?(s.type==='타자'?rand(2,5):s.pos==='선발투수'?rand(45,100):s.pos==='마무리'?rand(8,18):rand(10,30)):0;let events=[],hits=0,hr=0,bb=0,ks=0,ab=0,outs=0,er=0,walk=0,win=rand(0,1);let name=s.name;let inning=s.type==='투수'?(s.pos==='마무리'?rand(8,9):s.pos==='중간계투'?rand(5,8):1):0;let chance=s.type==='타자'?clamp(.17+(s.attrs[1]-50)*.003,.08,.55):clamp(.15+(s.attrs[2]-50)*.001,.07,.4);
if(participate&&s.type==='타자'){for(let i=0;i<count;i++){let p=rand(3,7),roll=Math.random(),r;if(roll<.10+(s.attrs[2]-50)*.001){bb++;r='볼넷'}else{ab++;if(roll<chance){hits++;if(Math.random()<clamp(.08+(s.attrs[0]-50)*.004,.03,.40)){hr++;r='홈런'}else r=['안타','중전 안타','우전 안타','2루타'][rand(0,3)]}else if(Math.random()<.27){ks++;r='삼진'}else r=['땅볼','뜬공','직선타'][rand(0,2)]}events.push({mine:true,text:`${name} ${i+1}번째 타석 · ${p}구 승부 · ${r}`,pitches:p,result:r})}}
else if(participate){let batters=Math.max(1,Math.round(count/4));for(let i=0;i<batters;i++){let roll=Math.random(),r=roll<.22?'삼진':roll<.34?'볼넷':roll<.56?'피안타':'범타';if(r==='삼진')ks++;if(r==='볼넷')walk++;if(r==='피안타'&&Math.random()<.25)er++;if(r==='범타'||r==='삼진')outs++;events.push({mine:true,text:`${Math.min(9,inning+Math.floor(i/3))}회 · ${name} 등판 · ${rand(3,7)}구 승부 · ${r}`,result:r})}}
let others=['상대 타자 좌익수 뜬공','동료 타자 2루타','상대 타자 볼넷','동료 타자 적시타','상대 타자 병살타'];for(let i=0;i<8;i++)events.splice(rand(0,events.length),0,{mine:false,text:others[rand(0,others.length)]});let homeScore=rand(0,9),awayScore=rand(0,9);win=homeScore>awayScore?1:0;let result=homeScore>awayScore?'승':homeScore<awayScore?'패':'무';return {participate,events,hits,hr,bb,ks,ab,outs,er,walk,win,count,homeScore,awayScore,result,inning}}
let broadcastTimer=null,broadcastIndex=0,broadcastSpeed=1,broadcastPaused=false;
function clearBroadcast(){if(broadcastTimer!==null){clearTimeout(broadcastTimer);broadcastTimer=null}}
function play(){if(state.finished||game||state.games>=24)return;sectionReport=null;game=makeGame();broadcastIndex=0;broadcastSpeed=1;broadcastPaused=false;tab='시즌';render();scheduleBroadcast()}
function scheduleBroadcast(){clearBroadcast();if(!game||broadcastPaused||broadcastIndex>=game.events.length||tab!=='시즌')return;broadcastTimer=setTimeout(()=>{broadcastTimer=null;if(!game||broadcastPaused)return;broadcastIndex=Math.min(game.events.length,broadcastIndex+1);updateBroadcast();scheduleBroadcast()},Math.max(100,1050/broadcastSpeed))}
function updateBroadcast(){let log=document.getElementById('live-log'),progress=document.getElementById('live-progress'),btn=document.getElementById('live-finish');if(!game||!log)return;log.innerHTML=game.events.slice(0,broadcastIndex).map(e=>`<div style="color:${e.mine?'#9bd1ff':'#cad6e6'}">${e.mine?'● ':''}${esc(e.text)}</div>`).join('')||'<div class="muted">잠시 후 중계가 시작됩니다…</div>';log.scrollTop=log.scrollHeight;if(progress)progress.textContent=`${broadcastIndex} / ${game.events.length}개 장면`;if(btn){btn.disabled=broadcastIndex<game.events.length;btn.textContent=broadcastIndex<game.events.length?'중계 진행 중…':'경기 결과 확정 · 다음으로'}}
function changeBroadcastSpeed(v){broadcastSpeed=v;render();scheduleBroadcast()}
function toggleBroadcast(){broadcastPaused=!broadcastPaused;render();scheduleBroadcast()}
function skipBroadcast(){if(!game)return;clearBroadcast();broadcastIndex=game.events.length;broadcastPaused=false;render()}
function fastSection(){
 if(!state||state.finished||game)return;
 let s=state,beginYear=s.year,beginGames=s.games,remaining=24-s.games,before={ovr:ovr(s),money:s.money};
 let played=0,highlights=[],results=[],totals={ab:0,h:0,hr:0,bb:0,k:0,outs:0,er:0,walk:0};
 for(let i=0;i<remaining&&!s.finished;i++){
  let g=makeGame();if(g.participate){played++;if(g.hr)highlights.push(`${s.name}: ${g.hr}홈런`);else if(s.type==='투수'&&g.ks>=5)highlights.push(`${s.name}: ${g.ks}탈삼진`)}
  results.push({no:beginGames+i+1,result:g.result,home:g.homeScore,away:g.awayScore,played:g.participate});
  for(let key of Object.keys(totals))totals[key]+=g[key==='h'?'hits':key==='k'?'ks':key]||0;
  game=g;finish(true);
 }
 sectionReport={year:beginYear,from:beginGames,to:beginGames+results.length,played,results,wins:results.filter(x=>x.result==='승').length,losses:results.filter(x=>x.result==='패').length,draws:results.filter(x=>x.result==='무').length,ovrBefore:before.ovr,ovrAfter:ovr(s),money:s.money-before.money,highlights:highlights.slice(0,4),statsBefore:Object.fromEntries(Object.keys(totals).map(k=>[k,0])),statsAfter:totals};
 tab='시즌';render();
}
function reportScreen(){if(!sectionReport)return '';let r=sectionReport;let labels=state.type==='타자'?[['타수','ab'],['안타','h'],['홈런','hr'],['볼넷','bb']]:[['탈삼진','k'],['기록 아웃','outs'],['자책점','er'],['볼넷 허용','walk']];return `<div class="card hero"><h2>⏩ ${r.year}학년 남은 경기 빠른 진행</h2><p class="muted">${r.from+1}~${r.to}경기 · 총 ${r.results.length}경기 완료</p><h3>${r.wins}승 ${r.losses}패 ${r.draws}무</h3><div class="log" style="max-height:300px">${r.results.map(x=>`<div class="line"><span>${x.no}경기 ${x.played?'· 출전':'· 미출전'}</span><b>${x.home} : ${x.away} <span style="color:${x.result==='승'?'#78d6a0':x.result==='패'?'#ff9898':'#d3dce8'}">${x.result}</span></b></div>`).join('')}</div><div class="grid"><div class="stat"><div class="muted">출전 경기</div><b>${r.played}/${r.results.length}</b></div><div class="stat"><div class="muted">OVR 변화</div><b>${r.ovrBefore} → ${r.ovrAfter}</b></div></div><h3>개인 기록</h3>${labels.map(([label,key])=>`<div class="line"><span>${label}</span><b>${r.statsAfter[key]-r.statsBefore[key]}</b></div>`).join('')}<button class="ghost full" onclick="sectionReport=null;render()">결과 닫기</button></div>`}
function finish(silent=false){if(!game||(!silent&&broadcastIndex<game.events.length))return;clearBroadcast();let s=state,g=game;s.games++;if(g.participate){s.played++;s.trust=clamp(s.trust+(g.hits+g.ks>1?2:0)+(g.hits===0&&g.ks===0?-1:0),0,100);s.xp+=s.type==='타자'?g.ab*4+g.hits*2+g.bb*2:Math.max(8,g.count/2);s.stats.ab+=g.ab;s.stats.h+=g.hits;s.stats.hr+=g.hr;s.stats.bb+=g.bb;s.stats.k+=g.ks;s.stats.outs+=g.outs;s.stats.er+=g.er;s.stats.walk+=g.walk;
s.stats.g++;if(s.type==='투수'){s.stats.gs+=s.pos==='선발투수'?1:0;s.stats.pc+=g.count||0;s.stats.ha+=g.hits||0;s.stats.ra+=g.er||0;s.stats.bf+=(g.outs||0)+(g.hits||0)+(g.walk||0);
if(s.pos==='마무리'&&g.inning>=8&&g.result==='승'&&g.homeScore-g.awayScore<=3&&g.outs>=3){s.stats.sv++}
else if(s.pos==='중간계투'&&g.result==='승'&&g.outs>=3){s.stats.hld++}
else if(s.pos==='선발투수'&&g.result==='승'&&g.outs>=15){s.stats.w++}
}else{s.stats.pa+=g.ab+g.bb;s.stats.so+=g.ks;s.stats.rbi+=g.hr; s.stats.r+=g.hr;}
}else{s.xp+=5;}s.seasonWins+=g.win;s.money+=5;if(s.games%6===0){let idx=rand(0,5),cost=25+Math.floor(s.attrs[idx]/10)*8;if(s.xp>=cost&&s.attrs[idx]<150){s.attrs[idx]++;s.xp-=cost;s.posts.unshift(`${s.name}, 훈련과 경기 경험으로 ${names(s)[idx]} 능력치 상승!`)}s.shopUsed=false;shop=null;s.posts.unshift(`시즌 ${s.games/6}섹터 종료. 성장 상점이 새로 열렸습니다.`)}if(g.participate&&(g.hr>0||g.ks>=5))s.posts.unshift(`학교 야구부 소식: ${s.name}의 ${g.hr?'홈런':'인상적인 투구'}에 응원이 이어집니다.`);if(s.games===24){s.career.push({year:s.year,stats:{...s.stats},ovr:ovr(s)});if(s.year<3){s.year++;s.age++;s.games=0;s.played=0;s.stats=emptyStats();s.posts.unshift(`${s.name}, 고교 ${s.year}학년으로 진급!`)}else{s.posts.unshift('고교 3년을 마쳤습니다. 프로 드래프트는 다음 개발 단계에서 구현됩니다.');s.finished=true}}save();game=null;if(!silent)render()}
function gameScreen(){let g=game;return `<div class="card hero"><h2>⚾ 실시간 경기 중계</h2><div class="line"><span>${g.participate?'오늘 출전':'오늘은 벤치 대기'}</span><span class="pill">고교 리그 · ${state.games+1}경기</span></div><div class="live-score"><b>우리 팀 vs 상대 팀</b><span id="live-progress" class="live-count">${broadcastIndex} / ${g.events.length}개 장면</span></div><p class="muted">한 장면씩 순서대로 나타납니다. 내 선수는 강조 표시됩니다.</p><div id="live-log" class="log" aria-live="polite">${g.events.slice(0,broadcastIndex).map(e=>`<div style="color:${e.mine?'#9bd1ff':'#cad6e6'}">${e.mine?'● ':''}${esc(e.text)}</div>`).join('')||'<div class="muted">잠시 후 중계가 시작됩니다…</div>'}</div><div class="line"><span class="muted small">중계 속도</span><div class="choice">${[1,2,5,10].map(v=>`<button class="${broadcastSpeed===v?'sel':''}" onclick="changeBroadcastSpeed(${v})">${v}×</button>`).join('')}</div></div><div class="grid"><button class="ghost" onclick="toggleBroadcast()">${broadcastPaused?'▶ 재개':'Ⅱ 일시정지'}</button><button class="ghost" onclick="skipBroadcast()">⏭ 중계 건너뛰기</button></div><p class="muted small" style="margin-top:12px">현재는 타석·타자 단위 간이 중계입니다. 정식 투구별 엔진은 후속 구현 예정.</p><button id="live-finish" class="full" onclick="finish()" ${broadcastIndex<g.events.length?'disabled':''}>${broadcastIndex<g.events.length?'중계 진행 중…':'경기 결과 확정 · 다음으로'}</button></div>`}
function getShop(){if(!shop)shop=Array.from({length:3},(_,i)=>{let ix=rand(0,5),gain=rand(1,3),price=Math.round((12+gain*15)*(1+state.attrs[ix]/70));return{ix,gain,price}});return shop}
function buy(i){let x=getShop()[i];if(state.shopUsed||state.money<x.price||state.attrs[x.ix]>=150)return;state.money-=x.price;state.attrs[x.ix]=Math.min(150,state.attrs[x.ix]+x.gain);state.shopUsed=true;state.posts.unshift(`성장 상점: ${names(state)[x.ix]} +${x.gain} 강화 완료`);save();render()}
function season(){let s=state;layout(`${game?gameScreen():''}${reportScreen()}<div class="card"><h2>시즌 진행</h2><div class="line"><span>고교 ${s.year}학년</span><b>${s.games}/24경기</b></div><div class="bar"><i style="width:${s.games/24*100}%"></i></div><button class="full" onclick="fastSection()" ${s.finished||game?'disabled':''}>⏩ 남은 경기 빠른 진행 (${24-s.games}경기)</button><div class="line"><span class="muted">팀 승리 (간이 시뮬레이션)</span><b>${s.seasonWins}승</b></div>${s.finished?'<p class="warn">고교 커리어 종료 · 드래프트 구현 예정</p>':''}</div><div class="card"><h2>성장 상점</h2><p class="muted">6경기마다 상품 갱신 · 섹터당 1회 구매</p><div class="cards">${getShop().map((x,i)=>`<div class="offer"><div class="line"><div><b>${names(s)[x.ix]} +${x.gain}</b><div class="muted">현재 ${s.attrs[x.ix]} / 150</div></div><button onclick="buy(${i})" ${s.shopUsed||s.money<x.price||s.attrs[x.ix]>=150?'disabled':''}>${x.price}만원</button></div></div>`).join('')}</div>${s.shopUsed?'<p class="notice">이번 섹터 구매 완료</p>':''}</div>`)}
function player(){let s=state;layout(`<div class="card hero"><h2>${esc(s.name)}</h2><p class="muted">${s.type} · ${s.pos} · ${s.style} · ${s.age}세</p><h2>OVR ${ovr(s)}</h2></div><div class="card"><h3>능력치</h3>${s.attrs.map((v,i)=>`<div class="line"><span>${names(s)[i]}</span><b>${v} / 150</b></div><div class="bar"><i style="width:${v/150*100}%"></i></div>`).join('')}<div class="divider"></div><div class="line"><span>경험치</span><b>${Math.floor(s.xp)} XP</b></div><div class="line"><span>감독 신뢰도</span><b>${s.trust}/100</b></div></div><div class="card"><h3>커리어 관리</h3><button class="ghost full" onclick="newCareer()">새 커리어 / 저장 슬롯</button></div>`)}
function reactions(){layout(`<div class="card"><h2>반응 · 학교 SNS</h2><p class="muted">고교 선수에 대한 응원과 경기 소식</p>${state.posts.map((p,i)=>`<div class="offer" style="margin:9px 0"><span class="muted small">${i%2?'야구부 커뮤니티':'학교 스포츠 소식'}</span><p style="margin:7px 0 0">${esc(p)}</p></div>`).join('')}</div>`)}
function records(){let s=state,st=normalizeStats(s.stats);let all=emptyStats();for(let c of s.career){for(let k of Object.keys(all))all[k]+=Number((c.stats||{})[k]||0)}for(let k of Object.keys(all))all[k]+=Number(st[k]||0);
layout(`<div class="card hero"><h2>${esc(s.name)} · 기록실</h2><p class="muted">${s.pos} · ${s.style}</p><div class="choice"><button class="${recordMode==='season'?'sel':''}" onclick="recordMode='season';render()">이번 시즌</button><button class="${recordMode==='career'?'sel':''}" onclick="recordMode='career';render()">통산</button><button class="${recordMode==='years'?'sel':''}" onclick="recordMode='years';render()">연도별</button></div></div>${recordMode==='years'?`<div class="card"><h2>연도별 기록</h2>${s.career.map(c=>`<details class="offer"><summary>고교 ${c.year}학년 · OVR ${c.ovr}</summary>${detailedStats(c.stats,s.type)}</details>`).join('')}<details class="offer" open><summary>고교 ${s.year}학년 · 진행 중</summary>${detailedStats(st,s.type)}</details></div>`:`<div class="card"><h2>${recordMode==='career'?'통산':'이번 시즌'} 기록</h2>${detailedStats(recordMode==='career'?all:st,s.type)}</div>`}<div class="card"><p class="muted">ERA·WHIP·타율·OPS는 저장된 기록으로 계산합니다. WAR·wRC+는 아직 산출 모델이 없어 미산출로 표시합니다. 기존 버전에서 누락된 기록은 복구할 수 없으며, 현 경기 엔진의 기록은 간이 집계입니다.</p></div><div class="card"><h3>커리어 이벤트</h3>${s.events.map(x=>`<p class="muted">${esc(x)}</p>`).join('')}</div>`)}
let recordMode='season';
function newCareer(){state=null;game=null;sectionReport=null;tab='홈';render()}
function render(){if(tab!=='시즌')clearBroadcast();if(!state){setup();return}if(tab==='홈')home();else if(tab==='반응')reactions();else if(tab==='시즌')season();else if(tab==='선수')player();else records()}
load();
</script></body></html>
