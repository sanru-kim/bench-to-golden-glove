   let result=simulateGame(player.league[a],player.league[b],index*8+1,true);

function applySeasonGrowth(){

 ${FIELD_BASES.slice(1,4).map((p,i)=>{const [x,y]=xy(p);return `<rect id="broadcast-b${i+1}" class="base-open" x="${x-3}" y="${y-3}" width="6" height="6" transform="rotate(45 ${x} ${y})"/><circle id="broadcast-runner-${i+1}" class="runner-dot" r="4" visibility="hidden"/>`}).join('')}

function lineupPanel(side){const f=tournamentFilm,m=f.mine,team=side?m.b:m.a;
 return `<aside class="broadcast-roster" id="lineup-panel-${side}"><div class="roster-title"><strong>${esc(team)}</strong><span id="team-state-${side}">${side?'홈 · 수비':'원정 · 공격'}</span></div>${m.lineups[side].map((p,i)=>`<div id="lineup-${side}-${i}" class="roster-row ${p.id==='USER'?'mine':''}"><b>${i+1}</b><span><span class="roster-name-avatar">${p.id==='USER'?avatarIcon(player.avatar,25):''}<span>${esc(p.name)}${p.id==='USER'?'<em>나</em>':''}</span></span><small>${esc(p.pos)}</small></span><i class="at-bat"></i></div>`).join('')}<div class="roster-pitcher">${m.pitchers[side].id==='USER'?avatarIcon(player.avatar,25):''} 선발 ${esc(m.pitchers[side].name)}${m.pitchers[side].id==='USER'?' ★ 나':''}</div></aside>`;
}
function updateBroadcastSituation(e){
 const m=tournamentFilm.mine,side=e.side,index=e.battingIndex;
 for(let s=0;s<2;s++){
  $('team-state-'+s).textContent=s===side?'▶ 공격':'수비';$('lineup-panel-'+s).classList.toggle('attacking',s===side);
  m.lineups[s].forEach((p,i)=>{const row=$(`lineup-${s}-${i}`),active=s===side&&i===index;row.classList.toggle('current',active);row.querySelector('.at-bat').textContent=active?'타석':'';});
 }
 const own=m.a===player.school?0:1,myIndex=m.lineups[own].findIndex(p=>p.id==='USER'),onMound=m.pitchers[own].id==='USER'&&side!==own;
 const distance=myIndex<0?-1:(myIndex-(side===own?index:e.orders[own]%9)+9)%9;
 $('broadcast-attack').textContent=`${side?m.b:m.a} 공격 · ${side?m.a:m.b} 수비`;
 $('broadcast-my-status').textContent=onMound?'🔥 내가 투구 중':myIndex<0?(m.pitchers[own].id==='USER'?'내 선수: 선발투수 · 수비 때 등판':'내 선수: 벤치 대기 · 이번 경기 선발 제외'):side===own&&distance===0?'⚾ 지금 내 타석!':`내 선수 ${myIndex+1}번 · ${side!==own?'다음 공격 기준 ':''}${distance===0?'다음 타자':distance+'명 뒤 타석'}`;
 const p=e.play;
 $('broadcast-metrics').textContent=tournamentFilm.status==='before'?'선발 라인업 · 경기 준비 완료':p?`타구 ${Math.round(p.speed)}km/h · 발사각 ${Math.round(p.angle)}° · ${p.direction<0?'좌':'우'} ${Math.abs(Math.round(p.direction))}°` : e.pitch?`${e.pitch.balls} BALL · ${e.pitch.strikes} STRIKE · ${e.pitch.result}`:'주루 플레이';
}
function showBroadcastState(state){
 $('broadcast-score').textContent=`${state.score[0]} : ${state.score[1]}`;
 $('broadcast-out').textContent=`${'● '.repeat(state.outs)}${'○ '.repeat(3-state.outs)}· ${state.outs}아웃`;
 for(let i=1;i<=3;i++){const r=$('broadcast-runner-'+i),p=fieldScreen(FIELD_BASES[i]);$('broadcast-b'+i).setAttribute('class',state.runners[i-1]?'base-on':'base-open');r.setAttribute('cx',p[0]+7);r.setAttribute('cy',p[1]);r.setAttribute('visibility',state.runners[i-1]?'visible':'hidden');}
}
function animateBroadcastPlay(e,duration,done){
 const f=tournamentFilm,fielders=[...document.querySelectorAll('.video-field .fielder')],ball=$('broadcast-ball'),batter=$('broadcast-batter-dot'),moving=$('broadcast-moving-runners');
 if(!f||!ball)return;cancelAnimationFrame(f.animation);
 const lerp=(a,b,t)=>a.map((v,i)=>v+(b[i]-v)*clamp(t,0,1)),xy=fieldScreen,play=e.play,throws=play?.throwTo||[],home=xy([0,0]),mound=xy(FIELD_START[0]),target=play?xy(play.target):home;
 let trail=[];moving.innerHTML=(e.moves||[]).map((r,i)=>`<circle id="motion-runner-${i}" class="runner-dot" r="4"><title>${esc(r.name)}</title></circle>`).join('');
 for(const r of e.moves||[])if(r.from>0)$('broadcast-runner-'+r.from).setAttribute('visibility','hidden');
 batter.setAttribute('visibility',e.moves?.some(r=>r.from===0)?'hidden':'visible');batter.setAttribute('cx',169);batter.setAttribute('cy',265);
 const start=performance.now();
 function frame(now){
  if(tournamentFilm!==f||f.status!=='playing'||!ball.isConnected)return;
  const t=Math.min(1,(now-start)/duration),travel=clamp((t-.2)/.46,0,1);let pos;
  if(e.type==='steal')pos=t<.25?lerp(mound,home,t/.25):lerp(home,xy(FIELD_BASES[2]),(t-.25)/(e.res==='sb'?.75:.5));
  else if(e.type==='wild')pos=lerp(mound,xy([7,-9]),t/.5);
  else if(e.type==='pitch'&&e.pitch?.result==='파울')pos=t<.45?lerp(mound,home,t/.45):lerp(home,xy([-35,-3]),(t-.45)/.55);
  else if(t<.2)pos=lerp(mound,home,t/.2);
  else if(play){
   if(!play.ground&&!play.caught&&play.res!=='hr'){
    const air=clamp(play.flight/Math.max(play.flight,play.fieldTime),.35,.85);
    pos=travel<air?lerp(home,xy(play.landing),travel/air):lerp(xy(play.landing),target,(travel-air)/(1-air));
   }else if(play.ground){const tBall=travel*play.ballTime,frac=(tBall/(1+.14*tBall))/(play.ballTime/(1+.14*play.ballTime));pos=lerp(home,target,frac);}
   else pos=lerp(home,target,travel);
   if(t>.68&&throws.length){const part=clamp((t-.68)/.24,0,.9999)*throws.length,k=Math.floor(part),from=k?xy(FIELD_BASES[throws[k-1]]):target;pos=lerp(from,xy(FIELD_BASES[throws[k]]),part-k);}
  }else pos=home;
  const groundPos=[...pos];
  if(play&&!play.ground&&t>=.2&&t<=.66){const air=play.caught||play.res==='hr'?1:clamp(play.flight/Math.max(play.flight,play.fieldTime),.35,.85);if(travel<air)pos[1]-=Math.sin(travel/air*Math.PI)*Math.min(55,play.speed/3.6*Math.sin(play.angle*Math.PI/180)*1.4);}
  ball.setAttribute('cx',pos[0]);ball.setAttribute('cy',pos[1]);$('broadcast-shadow').setAttribute('cx',groundPos[0]);$('broadcast-shadow').setAttribute('cy',groundPos[1]);
  if(play&&t>.2&&t<.68){trail.push(pos);$('broadcast-trail').setAttribute('d',trail.map((p,i)=>(i?'L':'M')+p.join(',')).join(' '));}
  fielders.forEach((g,i)=>{
   const initial=FIELD_START[i];let dest=initial;
   if(play){
    if(i===play.fielder&&play.res!=='hr')dest=play.target;
    else if(i===2&&throws.includes(1))dest=FIELD_BASES[1];
    else if(i===(play.fielder===3?5:3)&&throws.includes(2))dest=FIELD_BASES[2];
    else if(i===4&&throws.includes(3))dest=FIELD_BASES[3];
    else if(i===1&&throws.includes(4))dest=[0,0];
    else if(i>=6&&i!==play.fielder&&fieldDistance(initial,play.target)<45)dest=lerp(initial,play.target,.2);
   }else if(e.type==='steal'&&i===3)dest=FIELD_BASES[2];
   g.setAttribute('transform',`translate(${xy(lerp(initial,dest,travel))})`);
  });
  (e.moves||[]).forEach((r,i)=>{const tag=e.res==='sf',u=clamp((t-(tag ? .68 : .2))/(tag ? .3 : .74),0,1),path=[...Array(Math.max(1,r.to-r.from)+1)].map((_,k)=>FIELD_BASES[Math.min(4,r.from+k)]),fraction=u*(path.length-1),idx=Math.min(path.length-2,Math.floor(fraction)),q=xy(lerp(path[idx],path[idx+1],fraction-idx)),node=$('motion-runner-'+i);node.setAttribute('cx',q[0]+(r.from?3:0));node.setAttribute('cy',q[1]);node.setAttribute('visibility',u>=1&&(r.out||r.to===4)?'hidden':'visible');});
  if(t<1)f.animation=requestAnimationFrame(frame);else{moving.innerHTML='';done();}
 }
 $('broadcast-trail').setAttribute('d','');f.animation=requestAnimationFrame(frame);
}
function renderTournamentLive(){
 videoShellOn();document.body.classList.add('broadcast-wide');const f=tournamentFilm;if(!f)return;
 const m=f.mine;
 $('app').innerHTML=`<div class="video-panel"><div class="video-status"><strong>🏆 전국대회 · ${tournamentLabel(f.round)}</strong><span class="video-live" id="broadcast-live">경기 시작 전</span></div><h2 class="video-title">그라운드 라이브</h2>
 <div class="broadcast-banner"><strong id="broadcast-attack">${esc(m.a)} 선공 · ${esc(m.b)} 후공</strong><span class="avatar-broadcast-badge">${avatarIcon(player.avatar,32)}<span id="broadcast-my-status"></span></span></div>
 <div class="broadcast-layout">${lineupPanel(0)}<section class="broadcast-center"><div class="video-score-wrap"><div class="video-score"><div class="school">${esc(m.a)}</div><div class="number" id="broadcast-score">0 : 0</div><div class="school">${esc(m.b)}</div></div><div class="video-status"><span id="broadcast-inning" class="video-inning">1회 초</span><span id="broadcast-out">○ ○ ○ · 0아웃</span></div>${diamondSVG()}<div class="video-hits"><span id="broadcast-batter">타자: 대기</span><span id="broadcast-pitcher">투수: 대기</span></div><div id="broadcast-metrics" class="broadcast-metrics">타구와 수비를 실시간 중계합니다.</div></div>

 if(m.events?.[0])updateBroadcastSituation(m.events[0]);

function setTournamentSpeed(n){if(!tournamentFilm||![1,2,5,10].includes(n))return;tournamentFilm.speed=n;for(const b of document.querySelectorAll('#broadcast-speed button'))b.classList.toggle('active',b.textContent===n+'×');}
function startTournamentFilm(){const f=tournamentFilm;if(!f||f.status!=='before')return;f.status='playing';$('broadcast-start').style.display='none';$('broadcast-skip').style.display='block';$('broadcast-live').textContent='● LIVE';tickTournamentFilm();}
function scheduleTournamentEvent(){const f=tournamentFilm;if(!f||f.status!=='playing')return;clearTimeout(f.timer);f.timer=setTimeout(tickTournamentFilm,Math.max(25,500/f.speed));}
function tickTournamentFilm(){
 const f=tournamentFilm;if(!f||f.status!=='playing')return;const e=f.mine.events[f.eventIndex++];if(!e){finishTournamentFilm();return;}
 updateBroadcastSituation(e);showBroadcastState(e.pre);
 $('broadcast-inning').textContent=`${e.inning}회 ${e.side===0?'초':'말'}${e.inning>=10?' · 승부치기':''}`;
 $('broadcast-batter').textContent=`${e.battingIndex+1}번 타자: ${e.name}`;$('broadcast-pitcher').textContent=`투수: ${e.pitcher}`;
 $('broadcast-text').textContent=e.type==='pitch'?e.text:e.play?`${e.name}, ${e.play.direction<-15?'왼쪽':e.play.direction>15?'오른쪽':'중앙'}으로 타구! 수비가 움직입니다.`:`${e.name}의 타석 · 주자 상황을 지켜봅니다.`;
 animateBroadcastPlay(e,Math.max(100,(e.type==='pitch'?850:2300)/f.speed),()=>{showBroadcastState(e.post);$('broadcast-text').textContent=e.text;scheduleTournamentEvent();});
}
function skipTournamentFilm(){if(!tournamentFilm)return;clearTimeout(tournamentFilm.timer);finishTournamentFilm()}
function finishTournamentFilm(){
 const f=tournamentFilm;if(!f||f.status==='finished')return;
 clearTimeout(f.timer);cancelAnimationFrame(f.animation);f.status='finished';
 view='tournament-finished';render();
}
function renderTournamentResult(){
 document.body.classList.remove('broadcast-wide');videoShellOn();const f=tournamentFilm;if(!f)return;
 const ownWins=f.mine.winner===player.school,s=f.after,p=f.prior;
 const sh=s.h-p.h,hr=s.hr-p.hr,rbi=s.rbi-p.rbi,outs=s.outs-p.outs,pk=s.pk-p.pk;

 <div class="video-result-card"><h3 style="margin:0 0 6px">${esc(player.name)} · 이번 경기</h3><div>타격 ${sh}안타 · ${hr}홈런 · ${rbi}타점</div><div>투구 ${ip}이닝 · ${pk}탈삼진</div></div>
