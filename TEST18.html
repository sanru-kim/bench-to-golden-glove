<script>
'use strict';
// TEST17: browser-only saves. Five independent slots; no login or external services.
const SAVE_KEY='bench-to-mlb-test17-careers';
let careerSlots=Array(5).fill(null),activeSlot=-1;
function persistSlots(){
 try{localStorage.setItem(SAVE_KEY,JSON.stringify({version:1,slots:careerSlots,activeSlot}));return true}
 catch(e){alert('브라우저 저장에 실패했습니다. 저장 공간이나 비공개 모드를 확인해 주세요.');return false}
}
function restoreSlots(){
 try{const raw=JSON.parse(localStorage.getItem(SAVE_KEY)||'null');
 if(raw&&Array.isArray(raw.slots)){careerSlots=Array.from({length:5},(_,i)=>raw.slots[i]||null);
 activeSlot=Number.isInteger(raw.activeSlot)&&raw.activeSlot>=0&&raw.activeSlot<5&&careerSlots[raw.activeSlot]?raw.activeSlot:-1;
 if(activeSlot>=0)player=structuredClone(careerSlots[activeSlot]);}}
 catch(e){console.warn('저장 데이터를 읽지 못했습니다',e)}
}
function loadCareer(n){if(n<0||n>=5||!careerSlots[n])return;
 activeSlot=n;player=structuredClone(careerSlots[n]);persistSlots();show('home')}
function deleteCareer(n){if(n<0||n>=5||!careerSlots[n])return;if(!confirm('이 슬롯의 커리어를 영구 삭제할까요?'))return;
 careerSlots[n]=null;if(activeSlot===n){activeSlot=-1;player=null}persistSlots();render()}
function saveToSlot(n,p){if(n<0||n>=5)throw new Error('슬롯 범위 오류');
 const old=careerSlots[n],oldSlot=activeSlot,oldPlayer=player;

  const e=document.createElement('span');e.className='fx-particle';e.textContent=icons[Math.floor(Math.random()*icons.length)];

function spinTwoWayStyles(){
 const max=35;
 function tick(){
  if(step!==25)return;
  twBatStyle=TW_BAT_STYLES[Math.floor(Math.random()*TW_BAT_STYLES.length)];
  twPitStyle=TW_PIT_STYLES[Math.floor(Math.random()*TW_PIT_STYLES.length)];
  twSpin++;renderTwoWayDraw();
  if(twSpin<max){const t=twSpin/max;twTimer=setTimeout(tick,45+Math.pow(t,4)*260)}
  else{twTimer=null;renderTwoWayDraw()}
 }tick();
}
function renderTwoWayDraw(){

 if(next){next.disabled=twSpin<35;next.textContent=twSpin<35?'🎰 스타일 추첨 중…':'주축 스탯 선택 →'}
}
