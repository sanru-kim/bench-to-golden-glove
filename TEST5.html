<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>벤치에서 믈브까지 · TEST5</title>
<style>
:root{font-family:system-ui,"Noto Sans KR",sans-serif;--bg:#f2f4f6;--fg:#191f28;--card:#fff;--border:#e5e8eb;--sub:#6b7684;--input:#f9fafb;--button:#3182f6;--buttonfg:#fff;color:var(--fg);background:var(--bg)}html[data-theme="dark"]{--bg:#101318;--fg:#f2f4f6;--card:#20252c;--border:#343b45;--sub:#a5adb8;--input:#171c22;--button:#3182f6;--buttonfg:#fff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);transition:background .2s,color .2s}button,input{font:inherit}button{cursor:pointer;border:1px solid var(--border);border-radius:12px;background:var(--card);color:var(--fg);padding:12px}button:disabled{opacity:.4;cursor:not-allowed}button.active{background:var(--button);color:var(--buttonfg);border-color:var(--button)}input{width:100%;background:var(--input);border:1px solid var(--border);border-radius:10px;padding:13px;color:var(--fg)}.shell{max-width:650px;margin:auto;padding:20px 15px 70px}header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border);padding:14px 16px;background:var(--card)}h1{font-size:20px;margin:0}h2{font-size:24px;margin:0 0 12px}h3{font-size:17px;margin:0 0 12px}.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:19px;margin:15px 0}.muted{color:var(--sub);font-size:14px;line-height:1.6}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.choices{display:flex;flex-wrap:wrap;gap:8px}.stat{background:var(--input);padding:12px;border-radius:10px}.stat b{display:block;font-size:19px;margin-top:5px}.full{width:100%;margin-top:12px}.badge{display:inline-block;padding:6px 10px;border-radius:20px;background:var(--input);color:var(--sub);font-size:12px}.gate{position:fixed;inset:0;z-index:10;background:var(--bg);display:grid;place-items:center;padding:20px}.gatebox{width:min(100%,430px);background:var(--card);border:1px solid var(--border);border-radius:22px;padding:30px 22px;text-align:center;box-shadow:0 20px 60px #0002}.error{color:#e5484d;min-height:22px}.hidden{display:none!important}.tabs{display:flex;gap:7px;overflow:auto;margin:15px 0}.tabs button{white-space:nowrap}.info{display:flex;justify-content:space-between;gap:10px;align-items:center}.row{margin:12px 0}.row label{display:block;margin-bottom:7px;color:var(--sub)}.divider{height:1px;background:var(--border);margin:18px 0}

/* TEST5: gentle, responsive UI motion */
:root{--motion-ease:cubic-bezier(.22,1,.36,1)}
button{transition:transform .16s var(--motion-ease),background-color .25s ease,border-color .25s ease,box-shadow .25s ease}
button:not(:disabled):active{transform:scale(.965)}
.card,.stat,input,header,.tabs,.badge{transition:background-color .32s ease,color .32s ease,border-color .32s ease,box-shadow .32s ease}
#app{will-change:opacity,transform}
#app.ui-leaving{opacity:0;transform:translateY(-7px);transition:opacity .13s ease,transform .13s ease}
#app.ui-entering{animation:screenIn .35s var(--motion-ease) both}
#app .card{animation:cardIn .38s var(--motion-ease) both}
#app .card:nth-child(2){animation-delay:.065s}
#app .card:nth-child(3){animation-delay:.11s}
#app h2,#app h3,#app .muted,#app .stat{animation:textRise .4s var(--motion-ease) both}
#app h3{animation-delay:.05s}#app .stat:nth-child(2n){animation-delay:.045s}#app .stat:nth-child(3n){animation-delay:.085s}
.gate{transition:opacity .34s ease,visibility .34s ease}
.gate.gate-out{opacity:0;visibility:hidden;pointer-events:none}
.gatebox{animation:gateIn .46s var(--motion-ease) both}
@keyframes screenIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes cardIn{from{opacity:0;transform:translateY(13px) scale(.992)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes textRise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes gateIn{from{opacity:0;transform:translateY(20px) scale(.98)}to{opacity:1;transform:translateY(0) scale(1)}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

/* TEST5: fixed five-button bottom navigation and top-right settings */
.shell{padding-bottom:112px}.header-actions{display:flex;align-items:center;gap:10px}.gear{width:42px;height:42px;padding:0;font-size:25px;border:0;background:transparent;border-radius:50%;display:grid;place-items:center}.gear.active{background:var(--input);color:var(--button)}
.bottom-nav{position:fixed;z-index:5;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--border);padding-bottom:env(safe-area-inset-bottom);transition:background-color .32s,border-color .32s}.bottom-inner{max-width:650px;margin:auto;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));padding:7px 5px}.bottom-nav button{border:0;background:transparent;border-radius:12px;padding:7px 0 5px;min-width:0;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--sub);font-size:11px;font-weight:600;transition:color .2s,transform .2s}.bottom-nav button.active{color:var(--button);background:transparent}.bottom-nav .nav-icon{font-size:24px;line-height:27px}.bottom-nav button:active{transform:scale(.93)}.bottom-nav button:focus-visible,.gear:focus-visible{outline:2px solid var(--button);outline-offset:2px}
</style></head><body>
<div id="gate" class="gate"><div class="gatebox"><div style="font-size:55px">⚾</div><h2>벤치에서 믈브까지</h2><span class="badge">대규모 업데이트 테스트 중</span><p class="muted">현재 일반 플레이는 중단되었습니다.<br>관리자 ID를 입력하면 개발용 화면에 입장할 수 있습니다.</p><form id="loginForm"><input id="adminId" type="password" autocomplete="off" placeholder="관리자 ID" aria-label="관리자 ID" required><button class="full" type="submit">관리자 입장</button></form><p id="loginError" class="error" role="alert"></p><p class="muted">TEST5 · 개발용 빌드</p></div></div>
<header><h1>⚾ 벤치에서 믈브까지</h1><div class="header-actions"><span class="badge">TEST5</span><button id="settings-gear" class="gear" onclick="show('settings')" aria-label="설정 열기" title="설정">⚙</button></div></header><div class="shell"><main id="app"></main></div>
<nav class="bottom-nav" aria-label="게임 메뉴"><div class="bottom-inner">
<button id="nav-home" onclick="show('home')"><span class="nav-icon">⌂</span><span>홈</span></button>
<button id="nav-season" onclick="show('season')"><span class="nav-icon">▦</span><span>시즌</span></button>
<button id="nav-player" onclick="show('player')"><span class="nav-icon">♟</span><span>선수</span></button>
<button id="nav-records" onclick="show('records')"><span class="nav-icon">▤</span><span>기록</span></button>
<button id="nav-reactions" onclick="show('reactions')"><span class="nav-icon">♧</span><span>반응</span></button>
</div></nav>
<script>
'use strict';
const BAT=['파워','정확','선구','주력','수비','멘탈'],PIT=['구속','구위','제구','멘탈','수비','체력'];
const styles=[
['타자','포수/1루수','홈런타자',[60,49,46,45,54,58]],['타자','포수/1루수','안타머신',[47,61,54,49,51,50]],['타자','포수/1루수','해결사',[50,59,51,46,53,53]],['타자','내야수','홈런타자',[59,49,46,52,54,52]],['타자','내야수','매의 눈',[46,53,62,51,52,48]],['타자','내야수','빠른발',[43,50,53,65,55,46]],['타자','지명타자','거포',[68,57,54,47,30,56]],['타자','지명타자','타점머신',[53,65,56,49,30,59]],['타자','지명타자','지명타자',[62,61,55,49,30,55]],['타자','외야수','장타자',[60,55,49,48,54,46]],['타자','외야수','빠른발',[43,50,53,65,55,46]],['타자','외야수','클러치 히터',[49,59,51,50,49,54]],
['투수','선발투수','파이어볼러',[63,56,45,46,50,52]],['투수','선발투수','철완',[50,55,49,52,45,61]],['투수','선발투수','해저드 브레이커',[48,50,55,61,48,50]],['투수','선발투수','어쌔신',[45,54,62,48,48,55]],['투수','중간계투','레이저볼러',[65,56,48,45,48,50]],['투수','중간계투','세이비어',[48,58,48,60,48,50]],['투수','중간계투','이닝 이터',[49,50,55,50,47,61]],['투수','마무리','터미네이터',[66,56,52,53,45,40]],['투수','마무리','돌부처',[51,67,53,55,45,41]],['투수','마무리','Born To K',[52,53,67,50,43,47]]];
const POS={'타자':['포수','1루수','2루수','3루수','유격수','좌익수','중견수','우익수','지명타자'],'투수':['선발투수','중간계투','마무리']};
const KEY='bench-to-mlb-test3';
const THEME_KEY='bench-to-mlb-theme';let themeChoice=localStorage.getItem(THEME_KEY)||'system';
const media=matchMedia('(prefers-color-scheme: dark)');function applyTheme(){document.documentElement.dataset.theme=themeChoice==='system'?(media.matches?'dark':'light'):themeChoice}function setTheme(v){themeChoice=v;localStorage.setItem(THEME_KEY,v);applyTheme();render()}media.addEventListener('change',()=>{if(themeChoice==='system')applyTheme()});applyTheme(); // 기존 정식 버전 저장 데이터와 분리
let player=null,kind='',pos='',selected=-1,view='home';
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const group=p=>['포수','1루수'].includes(p)?'포수/1루수':['2루수','3루수','유격수'].includes(p)?'내야수':['좌익수','중견수','우익수'].includes(p)?'외야수':p;
try{player=JSON.parse(localStorage.getItem(KEY))||null}catch(e){}
$('loginForm').addEventListener('submit',e=>{e.preventDefault();if($('adminId').value==='999000iii'){$('gate').classList.add('gate-out');$('adminId').value='';render();setTimeout(()=>$('gate').classList.add('hidden'),360)}else{$('loginError').textContent='관리자 ID가 올바르지 않습니다.'}});
let navTimer=null;
function show(v){
 if(view===v)return;
 clearTimeout(navTimer);
 const app=$('app');
 if(window.matchMedia('(prefers-reduced-motion: reduce)').matches){view=v;render();return}
 app.classList.remove('ui-entering');app.classList.add('ui-leaving');
 navTimer=setTimeout(()=>{view=v;render();app.classList.remove('ui-leaving');app.classList.add('ui-entering')},135);
}
function chooseKind(v){kind=v;pos='';selected=-1;render()}
function choosePos(v){pos=v;selected=-1;render()}
function pick(i){selected=i;render()}
function render(){
$('app').classList.remove('ui-entering');void $('app').offsetWidth;$('app').classList.add('ui-entering');
for(const v of ['home','season','player','records','reactions'])$('nav-'+v).classList.toggle('active',view===v||(v==='player'&&view==='create'));$('settings-gear').classList.toggle('active',view==='settings');
if(view==='settings'){$('app').innerHTML=`<div class="card"><h2>화면 설정</h2><p class="muted">원하는 화면 테마를 선택하세요. 설정은 자동 저장됩니다.</p><div class="choices">${[['system','시스템 설정'],['light','라이트 모드'],['dark','다크 모드']].map(([v,t])=>`<button class="${themeChoice===v?'active':''}" onclick="setTheme('${v}')">${t}</button>`).join('')}</div></div>`;return}
if(['season','records','reactions'].includes(view)){$('app').innerHTML=`<div class="card"><span class="badge">개발 준비 중</span><h2 style="margin-top:16px">${{season:'시즌',records:'기록',reactions:'반응'}[view]}</h2><p class="muted">이 기능은 대규모 리빌드에서 새롭게 개발할 예정입니다.</p></div>`;return}
if(view==='player'){if(!player){$('app').innerHTML=`<div class="card"><h2>선수를 생성해 주세요</h2><button onclick="show('create')">선수 생성</button></div>`;return}const labels=player.type==='타자'?BAT:PIT;$('app').innerHTML=`<div class="card"><span class="badge">선수 프로필</span><h2 style="margin-top:14px">${esc(player.name)}</h2><p class="muted">${esc(player.pos)} · ${esc(player.style)}</p><div class="grid">${player.attrs.map((n,i)=>`<div class="stat"><span class="muted">${labels[i]}</span><b>${n}</b></div>`).join('')}</div><button class="full" onclick="show('create')">새 선수 생성</button></div>`;return}
if(view==='home'){if(!player){$('app').innerHTML='<div class="card"><h2>아직 생성된 선수가 없습니다.</h2><button onclick="show(\'create\')">선수 생성하기</button></div>';return}
let labels=player.type==='타자'?BAT:PIT;
$('app').innerHTML=`<div class="card"><span class="badge">고교 1학년 · 개발용</span><h2 style="margin-top:15px">${esc(player.name)}</h2><p class="muted">${esc(player.pos)} · ${esc(player.style)}</p><h3>선수 능력치</h3><div class="grid">${player.attrs.map((n,i)=>`<div class="stat"><span class="muted">${labels[i]}</span><b>${n}</b></div>`).join('')}</div><p class="muted">현재는 선수 생성과 홈 화면만 사용할 수 있습니다. 경기, 시즌, 성장 등은 TEST 후속 버전에서 새로 개발합니다.</p></div><button onclick="show('create')">선수 생성 화면으로</button>`;return}
let name=$('name')?.value||'김민준';
let available=styles.map((s,i)=>({s,i})).filter(x=>x.s[0]===kind&&x.s[1]===group(pos));
let s=styles[selected];
$('app').innerHTML=`<div class="card"><h2>새로운 야구 인생을 시작하세요</h2><p class="muted">기존 선수 생성 선택 항목과 22개 스타일 데이터를 유지했습니다.</p></div><div class="card"><div class="row"><label for="name">선수 이름</label><input id="name" maxlength="14" value="${esc(name)}"></div><h3>1. 선수 유형</h3><div class="grid">${['타자','투수'].map(v=>`<button class="${kind===v?'active':''}" onclick="chooseKind('${v}')">${v}</button>`).join('')}</div>${kind?`<div class="divider"></div><h3>2. 세부 포지션</h3><div class="choices">${POS[kind].map(v=>`<button class="${pos===v?'active':''}" onclick="choosePos('${v}')">${v}</button>`).join('')}</div>`:''}${pos?`<div class="divider"></div><h3>3. 플레이 스타일</h3><div class="choices">${available.map(x=>`<button class="${selected===x.i?'active':''}" onclick="pick(${x.i})">${esc(x.s[2])}</button>`).join('')}</div>`:''}${s&&s[0]===kind&&s[1]===group(pos)?`<div class="divider"></div><h3>${esc(s[2])} · 초기 능력치</h3><div class="grid">${s[3].map((n,i)=>`<div class="stat"><span class="muted">${(kind==='타자'?BAT:PIT)[i]}</span><b>${n}</b></div>`).join('')}</div><button class="full" onclick="createPlayer()">이 선수로 커리어 시작</button>`:''}</div>`;
}
function createPlayer(){const s=styles[selected];if(!s||s[0]!==kind||s[1]!==group(pos))return;let name=$('name').value.trim().slice(0,14)||'김민준';if(player&&!confirm('기존 TEST5 선수를 새 선수로 교체할까요?'))return;player={name,type:kind,pos,style:s[2],attrs:[...s[3]],createdAt:new Date().toISOString()};localStorage.setItem(KEY,JSON.stringify(player));show('home')}
</script></body></html>
