// TEST7: 포지션별 가중 오버롤. 최고 99, 모든 신규 선수 시작 45.
const MAX_OVR=99, START_OVR=45;
const WEIGHTS={
 '포수':[.12,.18,.10,.05,.40,.15], '1루수':[.30,.28,.20,.03,.12,.07],
 '2루수':[.12,.25,.16,.15,.24,.08], '3루수':[.23,.23,.14,.07,.25,.08],
 '유격수':[.10,.23,.15,.15,.29,.08],
 '좌익수':[.24,.24,.15,.10,.18,.09], '중견수':[.13,.23,.16,.19,.22,.07],
 '우익수':[.25,.22,.15,.10,.20,.08], '지명타자':[.35,.34,.24,.04,0,.03],
 '선발투수':[.18,.27,.29,.09,.04,.13],
 '중간계투':[.23,.30,.30,.10,.04,.03],
 '마무리':[.28,.32,.27,.11,.02,0]
};
function overall(attrs,position){
 const w=WEIGHTS[position]||Array(6).fill(1/6);
 return Math.max(1,Math.min(MAX_OVR,Math.round(attrs.reduce((sum,n,i)=>sum+Math.min(99,Math.max(1,n))*w[i],0))));
}
// TEST7: 스타일별 강점과 약점을 확대하면서 포지션별 시작 OVR 45 보장.
// 스타일의 성장 특화 속성은 기존 설정을 변경하지 않음.
const STYLE_CONTRAST=1.75;
function initialAttrs(style,position){
 const base=style[3],w=WEIGHTS[position];
 const mean=base.reduce((sum,n,i)=>sum+n*w[i],0);
 // 가중 평균 45를 중심으로 편차를 증폭. 지명타자 수비 등 가중치 0인 속성도 개성 유지.
 let a=base.map(n=>Math.max(15,Math.min(99,Math.round(START_OVR+(n-mean)*STYLE_CONTRAST))));
 // 정확히 OVR 45가 되도록 가장 가중치가 큰 속성부터 미세 조정.
 const priority=[...w.keys()].sort((i,j)=>w[j]-w[i]);
 for(let t=0;t<100&&overall(a,position)!==START_OVR;t++){
  const dir=overall(a,position)<START_OVR?1:-1;
  let fixed=false;
  for(const i of priority){if(w[i]===0||a[i]+dir<1||a[i]+dir>99)continue;
   const before=Math.abs(a.reduce((sum,n,k)=>sum+n*w[k],0)-START_OVR);
   const after=Math.abs(a.reduce((sum,n,k)=>sum+(k===i?n+dir:n)*w[k],0)-START_OVR);
   if(after<before){a[i]+=dir;fixed=true;break}
  }
  if(!fixed)break;
 }
 return a;
}

'철완':'뛰어난 구위·제구·체력을 갖춘 장이닝 투수',
'돌부처':'구위와 제구가 좋고 득점권 위기에서 강한 투수',
'이닝 이터':'높은 체력으로 많은 이닝을 소화하는 투수',
'해저드 브레이커':'득점권에서 상대 안타 확률을 낮추는 투수',
'세이비어':'위기 상황의 피안타를 억제하는 투수',
'어쌔신':'구속은 낮지만 제구가 매우 뛰어난 투수',
'Born To K':'느린 공을 정교하게 제구하는 투수'
};
let themeChoice=localStorage.getItem(THEME_KEY)||'system';
if(!['system','light','dark'].includes(themeChoice))themeChoice='system';
const media=window.matchMedia('(prefers-color-scheme: dark)');
function applyTheme(){document.documentElement.dataset.theme=themeChoice==='system'?(media.matches?'dark':'light'):themeChoice}
function setTheme(v){themeChoice=v;localStorage.setItem(THEME_KEY,v);applyTheme();render()}
if(media.addEventListener)media.addEventListener('change',()=>{if(themeChoice==='system')applyTheme()});applyTheme();
let player=null;try{player=JSON.parse(localStorage.getItem(KEY))||null}catch(e){}
function styleForPlayer(p){return styles.find(s=>s[0]===p.type&&s[1]===group(p.pos)&&s[2]===p.style)}
if(player&&player.ratingVersion!==7){let st=styleForPlayer(player);if(st){player.attrs=initialAttrs(st,player.pos);player.ratingVersion=7;localStorage.setItem(KEY,JSON.stringify(player))}}
if(player&&!Array.isArray(player.focus))player.focus=[];
let view='home',step=1,kind='',pos='',selected=-1,focus=[],draftName='김민준',navTimer=null;
$('loginForm').addEventListener('submit',e=>{e.preventDefault();if($('adminId').value==='999000iii'){$('gate').classList.add('gate-out');$('adminId').value='';render();setTimeout(()=>$('gate').classList.add('hidden'),360)}else{$('loginError').textContent='관리자 ID가 올바르지 않습니다.'}});
function show(v){if(view===v)return;clearTimeout(navTimer);const app=$('app');if(window.matchMedia('(prefers-reduced-motion: reduce)').matches){view=v;render();return}app.classList.remove('ui-entering');app.classList.add('ui-leaving');navTimer=setTimeout(()=>{view=v;render();app.classList.remove('ui-leaving');app.classList.add('ui-entering')},135)}
function chooseKind(v){draftName=$('name')?.value||draftName;kind=v;pos='';selected=-1;focus=[];render()}
function choosePos(v){draftName=$('name')?.value||draftName;pos=v;selected=-1;focus=[];render()}
function nextStep(){if(step===1){draftName=$('name')?.value.trim().slice(0,14)||'김민준';if(!kind||!pos){alert('선수 유형과 포지션을 선택해 주세요.');return}step=2}else if(step===2){if(selected<0){alert('플레이 스타일을 선택해 주세요.');return}step=3}render();window.scrollTo({top:0,behavior:'smooth'})}
function prevStep(){if(step>1){step--;render();window.scrollTo({top:0,behavior:'smooth'})}}
function pick(i){selected=i;focus=[];render()}
function toggleFocus(i){if(focus.includes(i))focus=focus.filter(v=>v!==i);else if(focus.length<2)focus.push(i);render()}
function beginCreate(){step=1;kind='';pos='';selected=-1;focus=[];draftName='김민준';show('create')}
function savePlayer(){let s=styles[selected];if(!s||s[0]!==kind||s[1]!==group(pos)||focus.length!==2)return; if(player&&!confirm('기존 TEST 선수를 새 선수로 교체할까요?'))return;player={name:draftName,type:kind,pos,style:s[2],attrs:initialAttrs(s,pos),focus:[...focus],ratingVersion:7,createdAt:new Date().toISOString()};localStorage.setItem(KEY,JSON.stringify(player));show('home')}
function miniBars(attrs,labels){return `<div class="mini-bars">${attrs.map((v,i)=>`<div><div class="mini-label"><span>${labels[i]}</span><b>${v}</b></div><div class="mini-track"><div class="mini-fill" style="width:${v/99*100}%"></div></div></div>`).join('')}</div>`}
function statBars(attrs,labels,focused=[]){return `<div class="bar-list">${attrs.map((v,i)=>`<div class="bar-item"><div class="bar-top"><span>${labels[i]}${focused.includes(i)?'<small class="stat-focus">★ 주축</small>':''}</span><strong>${v}</strong></div><div class="bar-track"><div class="bar-fill" style="width:${Math.min(99,Math.max(0,v))/99*100}%"></div></div></div>`).join('')}</div>`}
const demoStandings=[['삼성 라이온즈','12승 5패'],['LG 트윈스','11승 6패'],['한화 이글스','10승 7패'],['KIA 타이거즈','9승 8패'],['KT 위즈','9승 8패'],['SSG 랜더스','8승 9패'],['롯데 자이언츠','8승 9패'],['두산 베어스','7승 10패'],['NC 다이노스','6승 11패'],['키움 히어로즈','5승 12패']];
function standingRows(n){return demoStandings.slice(0,n).map((row,i)=>`<div class="standing-row"><span class="rank">${i+1}</span><strong>${row[0]}</strong><span class="rec">${row[1]}</span></div>`).join('')}
function render(){const app=$('app');app.classList.remove('ui-entering');void app.offsetWidth;app.classList.add('ui-entering');for(const v of ['home','season','player','records','reactions'])$('nav-'+v).classList.toggle('active',view===v||(v==='player'&&view==='create'));$('settings-gear').classList.toggle('active',view==='settings');$('nav-home').classList.toggle('active',view==='standings');
 if(view==='settings'){app.innerHTML=`<div class="card"><h2>화면 설정</h2><p class="muted">휴대폰 테마에 맞추거나 직접 선택하세요.</p><div class="choices">${[['system','시스템 설정'],['light','라이트 모드'],['dark','다크 모드']].map(([v,t])=>`<button class="${themeChoice===v?'active':''}" onclick="setTheme('${v}')">${t}</button>`).join('')}</div></div>`;return}
 if(['season','records','reactions'].includes(view)){let names={season:'시즌',records:'기록',reactions:'반응'};app.innerHTML=`<div class="card"><span class="badge">준비 중</span><h2 style="margin-top:14px">${names[view]}</h2><p class="muted">새로운 시스템을 개발하고 있어요.</p></div>`;return}
 if(view==='home'){if(!player){app.innerHTML=`<div class="card"><h2>새로운 야구 인생,<br>지금 시작해요</h2><p class="muted">선수부터 만들어 볼까요?</p><button class="primary full" onclick="beginCreate()">선수 생성하기 →</button></div>`;return}
 const avatar=`<div class="avatar-slot" aria-label="추후 아바타가 들어갈 공간"><svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="3"><circle cx="32" cy="21" r="13"/><path d="M8 58c0-15 10-24 24-24s24 9 24 24"/></svg><small>아바타 준비 중</small></div>`;
 app.innerHTML=`<section class="card home-profile">${avatar}<div class="profile-main"><div class="profile-meta"><span>고교 1학년</span><span>17세</span><span>${esc(player.pos)}</span></div><div class="profile-name">${esc(player.name)}</div><div class="profile-ovr">OVR <strong>${overall(player.attrs,player.pos)}</strong></div></div></section><section class="card home-actions"><h2 class="section-title">커리어</h2><button class="home-action" disabled><span>다음 시즌 보내기<small class="action-sub">시즌 시스템 개발 예정</small></span><span class="chev">›</span></button><button class="home-action" disabled><span>트레이드 · 방출 요구<small class="action-sub">계약·이적 시스템 개발 예정</small></span><span class="chev">›</span></button></section><section class="card standings"><div class="standings-header"><h2 class="section-title" style="margin:0">팀 순위</h2><button onclick="show('standings')">전체 순위 보기 ›</button></div><div style="margin-top:17px">${standingRows(3)}</div><p class="standings-caption">현재 리그 엔진이 없어 예시 순위를 표시하고 있어요.</p></section>`;return}
 if(view==='standings'){app.innerHTML=`<button class="back-link" onclick="show('home')">‹ 홈으로</button><section class="card standings"><h2 class="section-title">팀 순위 전체 보기</h2><p class="muted">TEST9 UI 미리보기 · 아래 순위와 승패는 실제 경기 결과가 아닌 예시 데이터입니다.</p><div>${standingRows(10)}</div></section>`;return}
 if(view==='player'){if(!player){app.innerHTML=`<div class="card"><h2>아직 선수가 없어요</h2><button class="primary full" onclick="beginCreate()">선수 생성하기</button></div>`;return}let labels=player.type==='타자'?BAT:PIT;app.innerHTML=`<div class="card"><h2>${esc(player.name)}</h2><p class="muted">${esc(player.pos)} · ${esc(player.style)} · OVR ${overall(player.attrs,player.pos)}</p><div class="divider"></div><h3>능력치</h3>${statBars(player.attrs,labels,player.focus||[])}<p class="muted-note" style="margin-top:22px">★ 주축 스탯은 향후 자연 성장 시스템에서 다른 능력치보다 빠르게 성장하도록 연결될 예정이에요.</p><button class="full secondary" onclick="beginCreate()">새 선수 생성</button></div>`;return}
 if(view==='create'){const available=styles.map((s,i)=>({s,i})).filter(x=>x.s[0]===kind&&x.s[1]===group(pos));let ss=styles[selected],labels=kind==='타자'?BAT:PIT;let indicator=`<div class="step-indicator" aria-label="선수 생성 ${step}/3단계">${[1,2,3].map(v=>`<div class="${v<=step?'done':''}"></div>`).join('')}</div>`;
 if(step===1){app.innerHTML=`${indicator}<h2>어떤 선수로<br>시작할까요?</h2><p class="muted">이름과 포지션을 정해 주세요.</p><div class="card"><div class="row"><label for="name">선수 이름</label><input id="name" maxlength="14" value="${esc(draftName)}" placeholder="선수 이름"></div><h3>선수 유형</h3><div class="grid">${['타자','투수'].map(v=>`<button class="choice-tile ${kind===v?'active':''}" onclick="chooseKind('${v}')">${v}</button>`).join('')}</div>${kind?`<div class="divider"></div><h3>세부 포지션</h3><div class="grid">${POS[kind].map(v=>`<button class="choice-tile ${pos===v?'active':''}" onclick="choosePos('${v}')">${v}</button>`).join('')}</div>`:''}<button class="primary next-btn" onclick="nextStep()" ${!kind||!pos?'disabled':''}>다음 →</button></div>`;return}
 if(step===2){app.innerHTML=`${indicator}<h2>나만의 플레이 스타일</h2><p class="muted">${esc(pos)} 선수에게 어울리는 스타일을 골라 보세요.</p>${available.map(({s,i},k)=>`<button class="style-choice ${selected===i?'active':''}" style="animation-delay:${k*.055}s" onclick="pick(${i})"><div class="style-title">${esc(s[2])} ${selected===i?'✓':''}</div><div class="style-description">${esc(DESCRIPTION[s[2]]||'나만의 강점을 살리는 플레이 스타일')}</div>${miniBars(initialAttrs(s,pos),labels)}</button>`).join('')}<div class="inline-actions"><button onclick="prevStep()">이전</button><button class="primary" onclick="nextStep()" ${selected<0?'disabled':''}>다음 →</button></div>`;return}
 if(step===3&&ss){let attrs=initialAttrs(ss,pos);app.innerHTML=`${indicator}<h2>어떤 능력을<br>더 키우고 싶나요?</h2><p class="muted">커리어 동안 더 집중해서 성장할 주축 스탯 <b>2개</b>를 선택하세요.</p><div class="card"><span class="badge">${esc(ss[2])} · 시작 OVR 45</span><div style="margin-top:18px">${attrs.map((v,i)=>`<button class="focus-choice ${focus.includes(i)?'active':''}" onclick="toggleFocus(${i})"><span>${labels[i]} <span class="muted">${v}</span></span><strong>${focus.includes(i)?'✓ 선택됨':'＋'}</strong></button>`).join('')}</div><p class="muted">${focus.length}/2개 선택됨 · 선택한 스탯은 생성 후 변경할 수 없어요.</p><div class="inline-actions"><button onclick="prevStep()">이전</button><button class="primary" onclick="savePlayer()" ${focus.length!==2?'disabled':''}>선수 생성 완료</button></div></div>`;return}
 }
}
render();
</script></body></html>
