function records(){let s=state,st=normalizeStats(s.stats);let all=emptyStats();for(let c of s.career){for(let k of Object.keys(all))all[k]+=Number((c.stats||{})[k]||0)}for(let k of Object.keys(all))all[k]+=Number(st[k]||0);
layout(`<div class="card hero"><h2>${esc(s.name)} · 기록실</h2><p class="muted">${s.pos} · ${s.style}</p><div class="choice"><button class="${recordMode==='season'?'sel':''}" onclick="recordMode='season';render()">이번 시즌</button><button class="${recordMode==='career'?'sel':''}" onclick="recordMode='career';render()">통산</button><button class="${recordMode==='years'?'sel':''}" onclick="recordMode='years';render()">연도별</button></div></div>${recordMode==='years'?`<div class="card"><h2>연도별 기록</h2>${s.career.map(c=>`<details class="offer"><summary>${leagueLabel(c.stage)} ${c.year}${c.stage==='highschool'?'학년':'시즌'} · OVR ${c.ovr}</summary>${detailedStats(c.stats,s.type)}</details>`).join('')}<details class="offer" open><summary>${leagueLabel(s.stage)} ${s.year}${s.stage==='highschool'?'학년':'시즌'} · 진행 중</summary>${detailedStats(st,s.type)}</details></div>`:`<div class="card"><h2>${recordMode==='career'?'전체 리그 합산 (참고용)':'이번 시즌 · '+leagueLabel(s.stage)} 기록</h2>${detailedStats(recordMode==='career'?all:st,s.type)}</div>`}<div class="card"><p class="muted">ERA·WHIP·타율·OPS는 저장된 기록으로 계산합니다. WAR·wRC+는 아직 산출 모델이 없어 미산출로 표시합니다. 기존 버전에서 누락된 기록은 복구할 수 없으며, 현 경기 엔진의 기록은 간이 집계입니다.</p></div><div class="card"><h3>커리어 이벤트</h3>${s.events.map(x=>`<p class="muted">${esc(x)}</p>`).join('')}</div>`)}
let recordMode='season';
function newCareer(){state=null;game=null;sectionReport=null;tab='홈';render()}
function render(){if(tab!=='시즌')clearBroadcast();if(!state){setup();return}if(state.stage==='draft'){layout(draftScreen());return}if(tab==='홈')home();else if(tab==='반응')reactions();else if(tab==='시즌')season();else if(tab==='선수')player();else records()}
load();
</script></body></html>
