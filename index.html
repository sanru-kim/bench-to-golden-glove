}
function renderTournamentLive(){
 videoShellOn();document.body.classList.add('broadcast-wide');const f=tournamentFilm;if(!f)return;
 const m=f.mine;
 $('app').innerHTML=`<div class="video-panel"><div class="video-status"><strong>🏆 전국대회 · ${tournamentLabel(f.round)}</strong><span class="video-live" id="broadcast-live">경기 시작 전</span></div><h2 class="video-title">그라운드 라이브</h2>
 <div class="broadcast-banner"><strong id="broadcast-attack">${esc(m.a)} 선공 · ${esc(m.b)} 후공</strong><span class="avatar-broadcast-badge">${avatarIcon(player.avatar,32)}<span id="broadcast-my-status"></span></span></div>
 <div class="broadcast-layout">${lineupPanel(0)}<section class="broadcast-center"><div class="video-score-wrap"><div class="video-score"><div class="school">${teamLabel(m.a,34)}</div><div class="number" id="broadcast-score">0 : 0</div><div class="school">${teamLabel(m.b,34)}</div></div><div class="video-status"><span id="broadcast-inning" class="video-inning">1회 초</span><span id="broadcast-out">○ ○ ○ · 0아웃</span></div>${diamondSVG()}<div class="video-hits"><span id="broadcast-batter">타자: 대기</span><span id="broadcast-pitcher">투수: 대기</span></div><div id="broadcast-metrics" class="broadcast-metrics">타구와 수비를 실시간 중계합니다.</div></div>
 <div class="video-play" id="broadcast-text">라인업을 확인하고 경기를 시작하세요.</div></section>${lineupPanel(1)}</div>
 <div class="video-controls" id="broadcast-speed">${[1,2,5,10].map(n=>`<button onclick="setTournamentSpeed(${n})" class="${n===1?'active':''}">${n}×</button>`).join('')}</div><div class="video-bottom"><button class="video-button primary" id="broadcast-start" onclick="startTournamentFilm()">${tournamentLabel(f.round)} 시작</button><button class="video-button" id="broadcast-skip" style="display:none" onclick="skipTournamentFilm()">중계 건너뛰기</button></div></div>`;
 if(m.events?.[0])updateBroadcastSituation(m.events[0]);
}
function setTournamentSpeed(n){if(!tournamentFilm||![1,2,5,10].includes(n))return;tournamentFilm.speed=n;for(const b of document.querySelectorAll('#broadcast-speed button'))b.classList.toggle('active',b.textContent===n+'×');}
function startTournamentFilm(){const f=tournamentFilm;if(!f||f.status!=='before')return;f.status='playing';$('broadcast-start').style.display='none';$('broadcast-skip').style.display='block';$('broadcast-live').textContent='● LIVE';tickTournamentFilm();}
function scheduleTournamentEvent(){const f=tournamentFilm;if(!f||f.status!=='playing')return;clearTimeout(f.timer);f.timer=setTimeout(tickTournamentFilm,Math.max(25,500/f.speed));}
function tickTournamentFilm(){
 const f=tournamentFilm;if(!f||f.status!=='playing')return;const e=f.mine.events[f.eventIndex++];if(!e){finishTournamentFilm();return;}
 updateBroadcastSituation(e);showBroadcastState(e.pre);
 $('broadcast-inning').textContent=`${e.inning}회 ${e.side===0?'초':'말'}${e.inning>=10?' · 승부치기':''}`;
 $('broadcast-batter').textContent=`${e.battingIndex+1}번 타자: ${e.name}`;$('broadcast-pitcher').textContent=`투수: ${e.pitcher}`;
 $('broadcast-text').textContent=e.type==='pitch'?e.text:e.play?`${e.name}, ${e.play.direction<-15?'왼쪽':e.play.direction>15?'오른쪽':'중앙'}으로 타구! 수비가 움직입니다.`:`${e.name}의 타석 · 주자 상황을 지켜봅니다.`;
 animateBroadcastPlay(e,Math.max(100,(e.type==='pitch'?850:2300)/f.speed),()=>{showBroadcastState(e.post);$('broadcast-text').textContent=e.text;scheduleTournamentEvent();});
}
function skipTournamentFilm(){if(!tournamentFilm)return;clearTimeout(tournamentFilm.timer);finishTournamentFilm()}
function finishTournamentFilm(){
 const f=tournamentFilm;if(!f||f.status==='finished')return;
 clearTimeout(f.timer);cancelAnimationFrame(f.animation);f.status='finished';
 view='tournament-finished';render();
}
function renderTournamentResult(){
 document.body.classList.remove('broadcast-wide');videoShellOn();const f=tournamentFilm;if(!f)return;
 const ownWins=f.mine.winner===player.school,s=f.after,p=f.prior;
 const sh=s.h-p.h,hr=s.hr-p.hr,rbi=s.rbi-p.rbi,outs=s.outs-p.outs,pk=s.pk-p.pk;
 const ip=`${Math.floor(outs/3)}.${outs%3}`;
 $('app').innerHTML=`<div class="video-panel"><div class="video-label">${player.year}년 전국대회 · ${tournamentLabel(f.round)}</div>
 <h2 class="video-title">${ownWins?'🎉 승리했습니다!':'전국대회 경기 종료'}</h2>
 <div class="video-score-wrap"><div class="video-score"><div class="school">${teamLabel(f.mine.a,34)}</div><strong>${f.mine.score[0]} : ${f.mine.score[1]}</strong><div class="school">${teamLabel(f.mine.b,34)}</div></div>
 <p style="text-align:center;color:#aeb5c3;margin:4px 0">${ownWins?(f.round===3?'🏆 전국대회 우승!':'다음 라운드 진출'):'아쉽게도 전국대회에서 탈락했습니다.'}</p></div>
 <div class="video-result-card"><h3 style="margin:0 0 6px">${esc(player.name)} · 이번 경기</h3><div>타격 ${sh}안타 · ${hr}홈런 · ${rbi}타점</div><div>투구 ${ip}이닝 · ${pk}탈삼진</div></div>
 <div class="video-spacer"></div><div class="video-bottom"><button class="video-button primary" onclick="finalizeTournamentRound()">확인</button></div></div>`;
}
const videoBaseRender=render;
render=function(){
 syncAvatarHeader();
 if(view==='avatar'){videoShellOff();renderAvatarEditor();return;}
 if(view==='season-film'){renderSeasonFilm();return}
 if(view==='tournament-live'){renderTournamentLive();return}
 if(view==='tournament-finished'){renderTournamentResult();return}
 videoShellOff();videoBaseRender();
};

restoreSlots();view='home';render();
</script></body></html>
