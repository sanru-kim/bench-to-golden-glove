<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b1527"><title>벤치에서 믈브까지</title><style>
:root{font-family:system-ui,-apple-system,'Noto Sans KR',sans-serif;color:#ecf3ff;background:#081222}*{box-sizing:border-box}body{margin:0;background:linear-gradient(150deg,#081222,#102744);min-height:100vh}button,input,select{font:inherit}button{cursor:pointer;border:0;border-radius:12px;padding:12px 14px;background:#2b72d4;color:white;font-weight:700}button:disabled{opacity:.4;cursor:default}.ghost{background:#253750}.app{max-width:550px;margin:auto;min-height:100vh;padding:20px 16px 95px}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.muted{color:#a9bad2;font-size:13px}.small{font-size:12px}.brand{font-weight:900;letter-spacing:-.6px;font-size:21px}.card{background:#14263e;border:1px solid #304563;border-radius:18px;padding:17px;margin:12px 0;box-shadow:0 8px 24px #0002}.hero{background:linear-gradient(130deg,#153a6b,#13233d)}h1,h2,h3,p{margin:0 0 10px}h2{font-size:21px}h3{font-size:16px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.stat{padding:12px;background:#213550;border-radius:12px}.stat b{font-size:22px}.line{display:flex;justify-content:space-between;gap:10px;align-items:center;margin:8px 0}.pill{background:#29476a;border-radius:20px;padding:5px 10px;font-size:12px}.tabs{position:fixed;bottom:0;left:50%;transform:translateX(-50%);max-width:550px;width:100%;display:grid;grid-template-columns:repeat(5,1fr);background:#101f34;border-top:1px solid #344d70;padding:8px 4px calc(8px + env(safe-area-inset-bottom))}.tabs button{background:none;padding:10px 1px;font-size:12px;color:#a9bad2}.tabs button.active{color:#fff;background:#244e80}.full{width:100%;margin-top:8px}.log{max-height:270px;overflow:auto;background:#0b1a2d;border-radius:12px;padding:12px;font-size:13px;line-height:1.8}.log div{border-bottom:1px solid #243a55;padding:3px 0}.input{width:100%;background:#0b1a2d;border:1px solid #456184;border-radius:10px;color:#fff;padding:12px;margin:6px 0 13px}.choice{display:flex;gap:7px;flex-wrap:wrap}.choice button{font-size:12px;padding:9px;background:#273f5c}.choice button.sel{background:#2872d5}.bar{height:9px;background:#243a53;border-radius:10px;overflow:hidden}.bar>i{display:block;height:100%;background:#67b4ff}.notice{color:#b8e6c4}.warn{color:#ffda9b}.divider{border-top:1px solid #354b64;margin:12px 0}.center{text-align:center}.badge{font-size:12px;color:#cce2ff}.cards{display:grid;gap:9px}.offer{background:#203651;border-radius:12px;padding:13px}.offer b{color:#9ed5ff}.score{font-size:31px;font-weight:900}.spacer{height:8px}</style></head><body><div id="root" class="app"></div><script>
'use strict';const KEY='bench_to_mlb_v1';const BAT=['파워','정확','선구','주력','수비','멘탈'],PIT=['구속','구위','제구','멘탈','수비','체력'];
const styles=[
['타자','포수/1루수','홈런타자',[60,49,46,45,54,58]],['타자','포수/1루수','안타머신',[47,61,54,49,51,50]],['타자','포수/1루수','해결사',[50,59,51,46,53,53]],['타자','내야수','홈런타자',[59,49,46,52,54,52]],['타자','내야수','매의 눈',[46,53,62,51,52,48]],['타자','내야수','빠른발',[43,50,53,65,55,46]],['타자','지명타자','거포',[68,57,54,47,30,56]],['타자','지명타자','타점머신',[53,65,56,49,30,59]],['타자','지명타자','지명타자',[62,61,55,49,30,55]],['타자','외야수','장타자',[60,55,49,48,54,46]],['타자','외야수','빠른발',[43,50,53,65,55,46]],['타자','외야수','클러치 히터',[49,59,51,50,49,54]],
['투수','선발투수','파이어볼러',[63,56,45,46,50,52]],['투수','선발투수','철완',[50,55,49,52,45,61]],['투수','선발투수','해저드 브레이커',[48,50,55,61,48,50]],['투수','선발투수','어쌔신',[45,54,62,48,48,55]],['투수','중간계투','레이저볼러',[65,56,48,45,48,50]],['투수','중간계투','세이비어',[48,58,48,60,48,50]],['투수','중간계투','이닝 이터',[49,50,55,50,47,61]],['투수','마무리','터미네이터',[66,56,52,53,45,40]],['투수','마무리','돌부처',[51,67,53,55,45,41]],['투수','마무리','Born To K',[52,53,67,50,43,47]]];
let state=null,tab='홈',chosen=0,feed=[],game=null,shop=null,slots=[];
const $=s=>document.querySelector(s),rand=(a,b)=>Math.floor(Math.random()*(b-a+1))+a,clamp=(x,a,b)=>Math.max(a,Math.min(b,x)),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>Number(n).toLocaleString('ko-KR');const ovr=s=>(s.attrs.reduce((a,b)=>a+b,0)/6).toFixed(1);const names=s=>s.type==='타자'?BAT:PIT;
function load(){try{slots=JSON.parse(localStorage.getItem(KEY)||'[]');if(!Array.isArray(slots))slots=[]}catch(e){slots=[]}state=slots[0]||null;render()}
function save(){if(!state)return;let ix=slots.findIndex(s=>s.id===state.id);if(ix<0)slots.unshift(state);else slots[ix]=state;localStorage.setItem(KEY,JSON.stringify(slots));}
function start(){let name=($('#playerName').value||'김민준').trim().slice(0,14),sty=styles[chosen];if(slots.length>=5){alert('진행 중인 커리어는 최대 5개입니다.');return}state={id:Date.now(),name,type:sty[0],pos:sty[1],style:sty[2],attrs:[...sty[3]],age:16,year:1,section:1,games:0,played:0,money:60,trust:50,xp:0,career:[],events:[`고교 1학년 ${name}, ${sty[2]} 스타일로 선수 생활 시작`],stats:{ab:0,h:0,hr:0,bb:0,rbi:0,outs:0,er:0,k:0,walk:0},posts:[`학교 야구부에 신입 선수 ${name}이(가) 합류했습니다. 응원합니다!`],shopUsed:false,seasonWins:0};slots.unshift(state);save();tab='홈';render()}
function layout(content){$('#root').innerHTML=`<header class="head"><div><div class="brand">⚾ 벤치에서 믈브까지</div><div class="muted">BENCH TO MLB · 플레이 가능한 초기 버전</div></div><span class="pill">v0.1</span></header>${content}<nav class="tabs">${['홈','반응','시즌','선수','기록'].map(t=>`<button class="${tab===t?'active':''}" onclick="go('${t}')">${({홈:'⌂',반응:'☏',시즌:'▦',선수:'♙',기록:'★'})[t]}<br>${t}</button>`).join('')}</nav>`}
function go(t){tab=t;render()}
function setup(){layout(`<div class="card hero"><h2>새로운 야구 인생을 시작하세요</h2><p class="muted">고교 벤치에서 시작해 최고의 무대를 꿈꾸는 선수의 첫걸음.</p></div><div class="card"><h3>선수 이름</h3><input id="playerName" class="input" maxlength="14" value="김민준" aria-label="선수 이름"><h3>시작 스타일 · 22종</h3><div class="choice">${styles.map((s,i)=>`<button class="${chosen===i?'sel':''}" onclick="pick(${i})">${s[1]} · ${s[2]}</button>`).join('')}</div><div id="preview"></div><button class="full" onclick="start()">커리어 시작</button></div>${slots.length?`<div class="card"><h3>저장된 커리어</h3>${slots.map((s,i)=>`<button class="ghost full" onclick="resume(${i})">${esc(s.name)} · ${s.year}학년 · OVR ${ovr(s)}</button>`).join('')}</div>`:''}`);preview()}
function pick(i){chosen=i;render()}function preview(){let s=styles[chosen];let el=$('#preview');if(el)el.innerHTML=`<div class="divider"></div><div class="line"><b>${s[0]} · ${s[1]}</b><span class="pill">OVR 52.0</span></div><div class="grid">${s[3].map((v,i)=>`<div class="stat"><div class="muted">${(s[0]==='타자'?BAT:PIT)[i]}</div><b>${v}</b></div>`).join('')}</div>`}
function resume(i){state=slots[i];tab='홈';render()}
function home(){let s=state;layout(`<div class="card hero"><div class="line"><span class="pill">고교 ${s.year}학년 · ${s.pos}</span><span class="badge">${s.style}</span></div><h2>${esc(s.name)}</h2><div class="line"><div><div class="muted">종합 능력치</div><div class="score">${ovr(s)}</div></div><div class="center"><div class="muted">감독 신뢰도</div><h2>${s.trust}/100</h2></div></div><div class="bar"><i style="width:${s.trust}%"></i></div></div><div class="grid"><div class="card"><div class="muted">시즌 경기</div><h2>${s.games} / 24</h2></div><div class="card"><div class="muted">보유 자금</div><h2>${fmt(s.money)}만원</h2></div></div><div class="card"><h3>다음 경기</h3><p class="muted">고교 지역 리그 · ${s.games+1}번째 경기</p><button class="full" onclick="play()" ${s.games>=24?'disabled':''}>⚾ 경기 진행</button><button class="ghost full" onclick="go('시즌')">시즌 및 성장 상점</button></div><div class="card"><h3>최근 소식</h3><p>${esc(s.posts[0]||'아직 소식이 없습니다.')}</p></div>`)}
function makeGame(){let s=state,participate=Math.random()<clamp(.25+(Number(ovr(s))-52)*.012+(s.trust-50)*.003,.12,.91);let count=participate?(s.type==='타자'?rand(2,5):s.pos==='선발투수'?rand(45,100):rand(10,30)):0;let events=[],hits=0,hr=0,bb=0,ks=0,ab=0,outs=0,er=0,walk=0,win=rand(0,1);let name=s.name;let chance=s.type==='타자'?clamp(.17+(s.attrs[1]-50)*.003,.08,.55):clamp(.15+(s.attrs[2]-50)*.001,.07,.4);
if(participate&&s.type==='타자'){for(let i=0;i<count;i++){let p=rand(3,7),roll=Math.random(),r;if(roll<.10+(s.attrs[2]-50)*.001){bb++;r='볼넷'}else{ab++;if(roll<chance){hits++;if(Math.random()<clamp(.08+(s.attrs[0]-50)*.004,.03,.40)){hr++;r='홈런'}else r=['안타','중전 안타','우전 안타','2루타'][rand(0,3)]}else if(Math.random()<.27){ks++;r='삼진'}else r=['땅볼','뜬공','직선타'][rand(0,2)]}events.push({mine:true,text:`${name} ${i+1}번째 타석 · ${p}구 승부 · ${r}`,pitches:p,result:r})}}
else if(participate){let batters=Math.max(1,Math.round(count/4));for(let i=0;i<batters;i++){let roll=Math.random(),r=roll<.22?'삼진':roll<.34?'볼넷':roll<.56?'피안타':'범타';if(r==='삼진')ks++;if(r==='볼넷')walk++;if(r==='피안타'&&Math.random()<.25)er++;if(r==='범타'||r==='삼진')outs++;events.push({mine:true,text:`${name} · ${rand(3,7)}구 승부 · ${r}`,result:r})}}
let others=['상대 타자 좌익수 뜬공','동료 타자 2루타','상대 타자 볼넷','동료 타자 적시타','상대 타자 병살타'];for(let i=0;i<8;i++)events.splice(rand(0,events.length),0,{mine:false,text:others[rand(0,others.length)]});return {participate,events,hits,hr,bb,ks,ab,outs,er,walk,win,count}}
function play(){if(state.games>=24)return;game=makeGame();tab='시즌';render()}
function finish(){if(!game)return;let s=state,g=game;s.games++;if(g.participate){s.played++;s.trust=clamp(s.trust+(g.hits+g.ks>1?2:0)+(g.hits===0&&g.ks===0?-1:0),0,100);s.xp+=s.type==='타자'?g.ab*4+g.hits*2+g.bb*2:Math.max(8,g.count/2);s.stats.ab+=g.ab;s.stats.h+=g.hits;s.stats.hr+=g.hr;s.stats.bb+=g.bb;s.stats.k+=g.ks;s.stats.outs+=g.outs;s.stats.er+=g.er;s.stats.walk+=g.walk;}else{s.xp+=5;}s.seasonWins+=g.win;s.money+=5;if(s.games%6===0){let idx=rand(0,5),cost=25+Math.floor(s.attrs[idx]/10)*8;if(s.xp>=cost&&s.attrs[idx]<150){s.attrs[idx]++;s.xp-=cost;s.posts.unshift(`${s.name}, 훈련과 경기 경험으로 ${names(s)[idx]} 능력치 상승!`)}s.shopUsed=false;shop=null;s.posts.unshift(`시즌 ${s.games/6}섹터 종료. 성장 상점이 새로 열렸습니다.`)}if(g.participate&&(g.hr>0||g.ks>=5))s.posts.unshift(`학교 야구부 소식: ${s.name}의 ${g.hr?'홈런':'인상적인 투구'}에 응원이 이어집니다.`);if(s.games===24){s.career.push({year:s.year,stats:{...s.stats},ovr:ovr(s)});if(s.year<3){s.year++;s.age++;s.games=0;s.played=0;s.stats={ab:0,h:0,hr:0,bb:0,rbi:0,outs:0,er:0,k:0,walk:0};s.posts.unshift(`${s.name}, 고교 ${s.year}학년으로 진급!`)}else{s.posts.unshift('고교 3년을 마쳤습니다. 프로 드래프트는 다음 개발 단계에서 구현됩니다.');s.finished=true}}save();game=null;render()}
function gameScreen(){let g=game;return `<div class="card hero"><h2>⚾ 경기 중계</h2><div class="line"><span>${g.participate?'오늘 출전':'오늘은 벤치 대기'}</span><span class="pill">고교 리그</span></div><p class="muted">내 선수는 상세 중계, 다른 선수는 간략 중계</p><div class="log">${g.events.map(e=>`<div style="color:${e.mine?'#9bd1ff':'#cad6e6'}">${e.mine?'● ':''}${esc(e.text)}</div>`).join('')}</div><p class="muted small">현재는 타석·타자 단위 중계 프로토타입입니다. 정식 투구별 엔진은 후속 구현 예정.</p><button class="full" onclick="finish()">경기 결과 확정 · 다음으로</button></div>`}
function getShop(){if(!shop)shop=Array.from({length:3},(_,i)=>{let ix=rand(0,5),gain=rand(1,3),price=Math.round((12+gain*15)*(1+state.attrs[ix]/70));return{ix,gain,price}});return shop}
function buy(i){let x=getShop()[i];if(state.shopUsed||state.money<x.price||state.attrs[x.ix]>=150)return;state.money-=x.price;state.attrs[x.ix]=Math.min(150,state.attrs[x.ix]+x.gain);state.shopUsed=true;state.posts.unshift(`성장 상점: ${names(state)[x.ix]} +${x.gain} 강화 완료`);save();render()}
function season(){let s=state;layout(`${game?gameScreen():''}<div class="card"><h2>시즌 진행</h2><div class="line"><span>고교 ${s.year}학년</span><b>${s.games}/24경기</b></div><div class="bar"><i style="width:${s.games/24*100}%"></i></div><div class="line"><span class="muted">팀 승리 (간이 시뮬레이션)</span><b>${s.seasonWins}승</b></div>${s.finished?'<p class="warn">고교 커리어 종료 · 드래프트 구현 예정</p>':''}</div><div class="card"><h2>성장 상점</h2><p class="muted">6경기마다 상품 갱신 · 섹터당 1회 구매</p><div class="cards">${getShop().map((x,i)=>`<div class="offer"><div class="line"><div><b>${names(s)[x.ix]} +${x.gain}</b><div class="muted">현재 ${s.attrs[x.ix]} / 150</div></div><button onclick="buy(${i})" ${s.shopUsed||s.money<x.price||s.attrs[x.ix]>=150?'disabled':''}>${x.price}만원</button></div></div>`).join('')}</div>${s.shopUsed?'<p class="notice">이번 섹터 구매 완료</p>':''}</div>`)}
function player(){let s=state;layout(`<div class="card hero"><h2>${esc(s.name)}</h2><p class="muted">${s.type} · ${s.pos} · ${s.style} · ${s.age}세</p><h2>OVR ${ovr(s)}</h2></div><div class="card"><h3>능력치</h3>${s.attrs.map((v,i)=>`<div class="line"><span>${names(s)[i]}</span><b>${v} / 150</b></div><div class="bar"><i style="width:${v/150*100}%"></i></div>`).join('')}<div class="divider"></div><div class="line"><span>경험치</span><b>${Math.floor(s.xp)} XP</b></div><div class="line"><span>감독 신뢰도</span><b>${s.trust}/100</b></div></div><div class="card"><h3>커리어 관리</h3><button class="ghost full" onclick="newCareer()">새 커리어 / 저장 슬롯</button></div>`)}
function reactions(){layout(`<div class="card"><h2>반응 · 학교 SNS</h2><p class="muted">고교 선수에 대한 응원과 경기 소식</p>${state.posts.map((p,i)=>`<div class="offer" style="margin:9px 0"><span class="muted small">${i%2?'야구부 커뮤니티':'학교 스포츠 소식'}</span><p style="margin:7px 0 0">${esc(p)}</p></div>`).join('')}</div>`)}
function records(){let s=state,st=s.stats;layout(`<div class="card"><h2>이번 시즌 기록</h2><div class="grid">${(s.type==='타자'?[['타율',st.ab?(st.h/st.ab).toFixed(3).replace(/^0/,''):'.000'],['안타',st.h],['홈런',st.hr],['볼넷',st.bb]]:[['탈삼진',st.k],['피자책점',st.er],['기록 아웃',st.outs],['볼넷 허용',st.walk]]).map(([k,v])=>`<div class="stat"><div class="muted">${k}</div><b>${v}</b></div>`).join('')}</div></div><div class="card"><h2>커리어 기록</h2>${s.career.length?s.career.map(c=>`<div class="line"><span>고교 ${c.year}학년</span><b>OVR ${c.ovr}</b></div>`).join(''):'<p class="muted">아직 종료한 시즌이 없습니다.</p>'}</div><div class="card"><h3>커리어 이벤트</h3>${s.events.map(x=>`<p class="muted">${esc(x)}</p>`).join('')}</div>`)}
function newCareer(){state=null;game=null;tab='홈';render()}
function render(){if(!state){setup();return}if(tab==='홈')home();else if(tab==='반응')reactions();else if(tab==='시즌')season();else if(tab==='선수')player();else records()}
load();
</script></body></html>
